log_format hamark_wecom_proxy '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=hamark_wecom_proxy:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hamark-wecom.boga.plus;

    ssl_certificate /etc/letsencrypt/live/hamark-wecom.boga.plus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamark-wecom.boga.plus/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/hamark-wecom.access.log hamark_wecom_proxy;
    error_log /var/log/nginx/hamark-wecom.error.log warn;
    client_max_body_size 4k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;

    location = /health {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/member-by-code {
        limit_except POST {
            deny all;
        }
        limit_req zone=hamark_wecom_proxy burst=5 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hamark-wecom.boga.plus;
    return 301 https://$host$request_uri;
}
