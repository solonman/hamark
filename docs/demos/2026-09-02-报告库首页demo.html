<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报告库首页 demo</title>
<!--
  报告库首页 demo　2026-09-02
  对齐视频库首页；多出来的是报告特有的三种状态：排队中 → 生成页图 n/N → 就绪，以及转换失败。
  「进入工作台」直接打开同目录下的 V2 工作台 demo。纯前端，不保存。
-->
<style>

:root{
  --bg:#10110f; --panel:#171815; --raised:#20211d; --field:#0f100e;
  --ink:#e6e7df; --ink2:#92958b; --ink3:#6d7066;
  --subject:#c7aa72; --answer:#d4d6cd;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.07);
  --acc:#dfff4f; --acc-dim:rgba(223,255,79,.4);
  --warn:#ffae78; --danger:#ff8f7d;
  --t-命题:#ff8d4d; --t-路线:#d86aae; --t-故事:#6ca0d8; --t-成果:#dfff4f; --t-行动:#75b985;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2,h3,h4{margin:0;font-weight:800}
.hide{display:none!important}

/* ---------------- 顶栏 ---------------- */
.topbar{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);background:rgba(16,17,15,.96);backdrop-filter:blur(18px)}
.topbar-in{max-width:1460px;margin:0 auto;min-height:66px;padding:8px clamp(16px,3vw,40px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.brand b{color:var(--acc);font-size:22px;font-weight:900;letter-spacing:-.08em}
.brand .name{font-weight:900;letter-spacing:-.05em}
.brand .sub{color:var(--ink2);font-size:9px;letter-spacing:.15em}
.topnav{display:flex;gap:18px;margin-left:8px}
.topnav button{color:var(--ink2);font-size:11px;font-weight:800;letter-spacing:.08em}
.topnav button.on{color:var(--ink)}
.topnav button:hover{color:var(--acc)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:10px;color:var(--ink2);white-space:nowrap}
.chip.acc{color:var(--acc);border-color:var(--acc-dim)}
.case-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch;letter-spacing:-.02em}
.pillbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:11px;color:var(--ink2)}
.pillbtn:hover{border-color:var(--acc-dim);color:var(--acc)}
.pillbtn.on{border-color:var(--acc-dim);color:var(--acc);background:rgba(223,255,79,.09)}
.vnum{font-family:var(--mono);font-weight:700;color:var(--acc)}
.save-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);white-space:nowrap}
.save-chip .dot{width:6px;height:6px;border-radius:99px;background:currentColor}
.save-chip.saved{color:var(--acc)}
.who{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.who select{border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:var(--panel);font-size:11px}
.undo{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.undo button{padding:6px 10px;font-size:11px;color:var(--ink2)}
.undo button:hover:not(:disabled){color:var(--acc)}
.undo button:disabled{opacity:.35;cursor:not-allowed}
.undo i{width:1px;background:var(--line)}

/* ---------------- 报告库 ---------------- */
.hero{width:min(1340px,calc(100% - 48px));margin:0 auto;padding:clamp(44px,7vw,96px) 0 40px}
.hero p{margin:0 0 8px;color:var(--subject);font-size:10px;font-weight:800;letter-spacing:.16em}
.hero h1{font-size:clamp(42px,7vw,86px);line-height:.94;letter-spacing:-.07em;font-weight:500}
.hero span{display:block;max-width:640px;margin-top:18px;color:var(--ink2);font-size:14px}
.libbar{display:flex;width:min(1340px,calc(100% - 48px));align-items:end;justify-content:space-between;gap:20px;margin:0 auto 26px;padding-top:22px;border-top:1px solid var(--line)}
.libbar p{margin:0 0 5px;color:var(--subject);font-size:9px;font-weight:900;letter-spacing:.17em}
.libbar h2{font-size:22px;letter-spacing:-.04em}
.libctl{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.libctl .pillbtn{padding:9px 14px;font-size:14px;font-weight:800}
.search{position:relative}
.search span{position:absolute;left:0;bottom:13px;color:var(--ink2);font-size:18px}
.search input{width:min(300px,42vw);border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px 13px 28px;font-size:18px}
.grid{display:grid;width:min(1340px,calc(100% - 48px));grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 24px;margin:0 auto;padding-bottom:80px}
.card{min-width:0}
.cover{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line);background:#0b0c0a}
.cover img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 46%,rgba(0,0,0,.66))}
.cover .fmt{position:absolute;top:12px;left:12px;z-index:2;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 9px;font-size:9px;letter-spacing:.06em;background:rgba(0,0,0,.4)}
.cover .pages{position:absolute;right:12px;bottom:12px;z-index:2;font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:2px 7px}
.cbody{padding:14px 2px 0}
.cact{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.enter{display:inline-flex;align-items:center;min-height:38px;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:0 16px;font-size:11px;font-weight:900;background:rgba(18,19,16,.88)}
.enter:hover{border-color:var(--acc-dim);background:rgba(223,255,79,.1);color:var(--acc)}
.metrics{display:flex;align-items:center;gap:10px;margin-left:auto}
.fav{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:11px;color:var(--ink2)}
.fav.on{border-color:#e4708f;color:#e4708f}
.fav b{font-family:var(--mono)}
.stars{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.stars i{font-style:normal;color:var(--subject);letter-spacing:.06em}
.cno{margin:0;color:var(--subject);font-size:9px;font-weight:900;letter-spacing:.17em}
.ctitle{display:flex;flex-direction:column;gap:3px;margin:6px 0 10px}
.ctitle small{color:var(--ink2);font-size:11px}
.ctitle span{font-size:20px;font-weight:800;letter-spacing:-.03em}
.cband{display:flex;flex-wrap:wrap;gap:8px;color:var(--ink2);font-size:11px}
.cband span{border:1px solid var(--line2);border-radius:999px;padding:3px 8px}
.weekhead{display:flex;width:min(1340px,calc(100% - 48px));margin:0 auto 16px;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.weekhead h3{font-size:15px;letter-spacing:-.03em}
.weekhead span{color:var(--ink2);font-size:11px}
.weekhead b{margin-left:auto;color:var(--subject);font-size:9px;letter-spacing:.14em}
.empty{width:min(900px,calc(100% - 48px));margin:40px auto 90px;padding:40px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center}
.empty p{color:var(--ink2)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{border:1px solid var(--line);border-radius:12px;background:rgba(31,25,20,.97);padding:9px 15px;font-size:12px;box-shadow:0 16px 42px rgba(0,0,0,.4)}

/* ---------- 报告特有：处理状态 ---------- */
.cover.busy img{filter:saturate(.5) brightness(.55)}
.state{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:grid;gap:7px}
.state b{font-size:12px;color:#fff}
.state small{color:rgba(255,255,255,.72);font-size:10.5px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.bar.err i{background:var(--danger)}
.cover .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:12px;background:radial-gradient(circle at 24% 22%,#2a2c24,#15160f 46%,#0b0c0a)}
.enter[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.retry{display:inline-flex;gap:6px}
.retry button{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:10.5px;color:var(--ink2)}
.retry button:hover{border-color:var(--acc-dim);color:var(--acc)}
.retry button.del:hover{border-color:rgba(255,143,125,.5);color:var(--danger)}
.cband .task{border-color:var(--acc-dim);color:var(--acc)}
/* ---------- 上传对话框 ---------- */
.ov{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(6,7,6,.86);backdrop-filter:blur(6px)}
.dlg{width:min(560px,calc(100vw - 32px));border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header small{display:block;color:var(--subject);font-size:9px;letter-spacing:.14em}
.dlg header b{font-size:14px}
.dlg header .x{margin-left:auto;color:var(--ink2);font-size:18px}
.dlg .body{display:grid;gap:14px;padding:16px 18px}
.drop{display:grid;place-items:center;gap:4px;border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--ink3);font-size:11.5px}
.drop b{color:var(--acc);font-size:13px}
.drop.has{border-style:solid;border-color:var(--acc-dim);color:var(--answer)}
.drop:hover{border-color:var(--acc-dim);background:rgba(223,255,79,.05)}
.field{display:grid;gap:5px}
.field small{color:var(--subject);font-size:10px;font-weight:800}
.field input,.field select{border:1px solid var(--line);border-radius:999px;background-color:var(--field);padding:0 12px;height:30px;font-size:12px;color:var(--ink)}
.field select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%2392958b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:10px 6px;padding-right:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{border-left:3px solid var(--subject);background:rgba(199,170,114,.07);padding:9px 12px;border-radius:0 9px 9px 0;color:var(--answer);font-size:11.5px;line-height:1.7}
.dlg footer{display:flex;justify-content:flex-end;gap:9px;padding:12px 18px;border-top:1px solid var(--line)}
.dlg footer button{border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:12px}
.dlg footer .go{border-color:var(--acc-dim);color:var(--acc);background:rgba(223,255,79,.1)}
.dlg footer .go:disabled{opacity:.4;cursor:not-allowed}
.up{display:grid;gap:6px;font-size:11.5px;color:var(--ink2)}
.up b{color:var(--ink);font-family:var(--mono)}
</style>
<div id="app"></div><div id="toast"></div>
<script>
"use strict";
const TASK_TYPES=["宣发企划","故事线","宣发阶段性提报","月度总结报告","专项宣发方案"];
const WORKBENCH="./2026-09-01-报告拆解工作台demo-V2.html";
/* 状态：QUEUED 排队中 → PROCESSING 生成页图 n/N → READY 就绪；FAILED 转换失败 */
const LIB=[
 {id:"honggutan",no:"CASE 01",title:"世纪地产红谷滩项目推广案",sub:"10 页谈｜蓝色创意（中国）",fmt:"PPT 97-2003",task:"宣发企划",pages:50,status:"READY",cover:"cover",
  uploader:"王策划",week:"2026 年第 36 周",versions:"2 个版本 · 最近 李工 09-01 14:20",tags:["城市综合体","竞标提报"],fav:6,stars:{v:2,s:4}},
 {id:"pujiang",no:"CASE 02",title:"万科浦江镇项目策略大纲",sub:"070413｜上海博加广告",fmt:"PPT 97-2003",task:"故事线",pages:235,status:"READY",cover:"pujiang",
  uploader:"张策划",week:"2026 年第 36 周",versions:"尚未开始拆解",tags:["别墅","策略大纲"],fav:3,stars:null},
 {id:"beicai",no:"CASE 03",title:"浦发仁恒北蔡项目提报",sub:"262 页",fmt:"PPTX",task:"宣发阶段性提报",pages:262,status:"PROCESSING",done:118,cover:"beicai",
  uploader:"李工",week:"2026 年第 36 周",versions:"页图生成中",tags:["住宅","提报"],fav:0,stars:null},
 {id:"qingpu",no:"CASE 04",title:"青浦某项目 9 月月度总结",sub:"PDF 直传",fmt:"PDF",task:"月度总结报告",pages:0,status:"QUEUED",cover:null,
  uploader:"老孙",week:"2026 年第 36 周",versions:"等待转换",tags:["月报"],fav:0,stars:null},
 {id:"xuhui",no:"CASE 05",title:"徐汇滨江专项宣发方案",sub:"PPTX",fmt:"PPTX",task:"专项宣发方案",pages:0,status:"FAILED",err:"第 14 页引用了未嵌入的字体「方正兰亭黑」，PPT → PDF 转换中断",cover:null,
  uploader:"张策划",week:"2026 年第 35 周",versions:"转换失败",tags:["专项"],fav:0,stars:null},
];
const S={items:LIB.map(x=>Object.assign({},x)),favs:new Set(["honggutan"]),weekly:false,query:"",role:"老孙",dlg:null};
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const img=k=>(k&&window.PG&&window.PG[k])||"";
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
function toast(t){const d=document.createElement("div");d.textContent=t;$("#toast").appendChild(d);setTimeout(()=>d.remove(),2800);}

function coverOf(r){
  const src=img(r.cover);
  const pic=src?'<img src="'+src+'" alt="">':'<div class="placeholder">'+(r.status==="FAILED"?"没有页图":"等待生成页图")+'</div>';
  let state="";
  if(r.status==="PROCESSING")state='<div class="state"><b>正在生成页图 '+r.done+' / '+r.pages+'</b><small>PPT → PDF 已完成，逐页渲染中，完成后自动就绪</small><div class="bar"><i style="width:'+Math.round(r.done/r.pages*100)+'%"></i></div></div>';
  else if(r.status==="QUEUED")state='<div class="state"><b>排队中</b><small>上传完成，等待转换（前面还有 1 份）</small><div class="bar"><i style="width:3%"></i></div></div>';
  else if(r.status==="FAILED")state='<div class="state"><b style="color:var(--danger)">转换失败</b><small>'+esc(r.err)+'</small><div class="bar err"><i style="width:100%"></i></div></div>';
  return '<a class="cover'+(r.status!=="READY"?" busy":"")+'" href="'+(r.status==="READY"?WORKBENCH:"#")+'" data-enter="'+r.id+'">'
    +pic+'<span class="fmt">'+esc(r.fmt)+'</span>'+(r.status==="READY"?'<span class="pages">'+r.pages+' 页</span>':'')+state+'</a>';
}
function card(r){
  const on=S.favs.has(r.id), favN=r.fav+(on?1:0);
  const ready=r.status==="READY";
  const actions=r.status==="FAILED"
    ? '<span class="retry"><button data-retry="'+r.id+'">重试</button><button data-repdf="'+r.id+'">改传 PDF</button><button class="del" data-del="'+r.id+'">删除</button></span>'
    : '<a class="enter" href="'+(ready?WORKBENCH:"#")+'" data-enter="'+r.id+'"'+(ready?'':' aria-disabled="true"')+'>'+(ready?"进入工作台":r.status==="QUEUED"?"等待转换":"生成页图中")+'</a>';
  return '<article class="card">'+coverOf(r)+'<div class="cbody"><div class="cact">'+actions
    +'<div class="metrics"><button class="fav'+(on?" on":"")+'" data-fav="'+r.id+'" title="每人每周 1 票"'+(ready?'':' disabled')+'><i>'+(on?"♥":"♡")+'</i><b>'+favN+'</b></button>'
    +(r.stars?'<span class="stars" title="老孙的作业评级"><b style="font-family:var(--mono)">v'+r.stars.v+'</b><i>'+stars(r.stars.s)+'</i></span>':(ready?'<span class="stars"><i>☆☆☆☆☆</i>待评级</span>':''))
    +'</div></div>'
    +'<p class="cno">'+esc(r.no)+'</p><div class="ctitle"><small>'+esc(r.sub)+'</small><span>'+esc(r.title)+'</span></div>'
    +'<div class="cband"><span class="task">'+esc(r.task)+'</span><span>上传者 '+esc(r.uploader)+'</span><span>'+esc(r.versions)+'</span>'+r.tags.map(t=>'<span>#'+esc(t)+'</span>').join("")+'</div>'
    +'</div></article>';
}
function view(){
  const q=S.query.trim().toLowerCase();
  const list=S.items.filter(r=>!q||(r.title+r.sub+r.uploader+r.task+r.tags.join("")).toLowerCase().includes(q));
  const favN=r=>r.fav+(S.favs.has(r.id)?1:0);
  let body;
  if(!list.length)body='<section class="empty"><h2>没有找到对应报告</h2><p>换一个报告名、上传者、任务类型或标签试试。</p></section>';
  else if(S.weekly){
    const g={};list.forEach(r=>{(g[r.week]=g[r.week]||[]).push(r);});
    body=Object.keys(g).map(w=>'<div class="weekhead"><h3>'+esc(w)+'</h3><b>'+g[w].length+' 份 · 按收藏数排序</b></div><section class="grid">'+g[w].slice().sort((a,b)=>favN(b)-favN(a)).map(card).join("")+'</section>').join("");
  }else body='<section class="grid">'+list.map(card).join("")+'</section>';
  return '<header class="topbar"><div class="topbar-in"><div class="brand"><b>R:</b><span class="name">RE:VERSE</span><span class="sub">反写</span></div>'
    +'<nav class="topnav"><button data-video>视频库</button><button class="on">报告库</button></nav><div class="spacer"></div>'
    +'<button class="pillbtn" data-upload>＋ 上传报告</button><span class="who">'+esc(S.role)+'</span></div></header>'
    +'<section class="hero"><p>REPORT REVERSE-ENGINEERING LIBRARY</p><h1>把一份提报，<br>拆回它的判断。</h1><span>沿真实页序，按「模块 → 单元 → 页 → 组块」把一份策略报告拆开，看清它是怎么被讲成立的。</span></section>'
    +'<section class="libbar"><div><p>REPORT LIBRARY</p><h2>报告库</h2></div><div class="libctl"><button class="pillbtn'+(S.weekly?" on":"")+'" data-week title="按上传周分组，周内按收藏数排序">按周显示</button>'
    +'<label class="search"><span>⌕</span><input value="'+esc(S.query)+'" placeholder="搜索报告名、上传者或标签" data-q></label></div></section>'
    +body+dialog();
}
function dialog(){
  const d=S.dlg; if(!d)return "";
  if(d.phase==="uploading")return '<div class="ov"><div class="dlg"><header><div><small>UPLOAD</small><b>正在上传</b></div></header>'
    +'<div class="body"><div class="up"><span>'+esc(d.file)+'</span><b>'+d.pct+'%</b><div class="bar"><i style="width:'+d.pct+'%"></i></div>'
    +'<span>'+(d.pct<100?"直传到对象存储，浏览器不用等服务器中转":"上传完成，进入转换队列…")+'</span></div></div></div></div>';
  return '<div class="ov" data-bg><div class="dlg"><header><div><small>UPLOAD</small><b>上传报告</b></div><button class="x" data-close>×</button></header>'
    +'<div class="body">'

function render(){$("#app").innerHTML=view();}
/* ---------- 交互 ---------- */
const H=[];const on=(sel,fn)=>H.push([sel,fn]);
on("[data-video]",()=>toast("视频库沿用现有页面，demo 只做报告库这一侧。"));
on("[data-fav]",el=>{const id=el.dataset.fav;S.favs.has(id)?S.favs.delete(id):(S.favs.clear(),S.favs.add(id));render();});
on("[data-week]",()=>{S.weekly=!S.weekly;render();});
on("[data-upload]",()=>{S.dlg={phase:"form",file:"",size:"",title:"",task:"",tags:""};render();});
on("[data-close]",()=>{S.dlg=null;render();});
on("[data-bg]",(el,e)=>{if(e.target===el){S.dlg=null;render();}});
on("[data-pick]",()=>{S.dlg.file="世纪·中央城 二期提报 0902.pptx";S.dlg.size="38.4 MB";S.dlg.title=S.dlg.title||"世纪·中央城 二期提报";render();});
on("[data-go]",()=>{
  const d=S.dlg;d.phase="uploading";d.pct=0;render();
  const t=setInterval(()=>{d.pct=Math.min(100,d.pct+9);render();if(d.pct>=100){clearInterval(t);setTimeout(()=>{
    const r={id:"new"+Date.now(),no:"CASE 06",title:d.title||d.file,sub:d.file,fmt:"PPTX",task:d.task||"未选任务类型",pages:64,status:"QUEUED",cover:null,
      uploader:S.role,week:"2026 年第 36 周",versions:"等待转换",tags:d.tags?d.tags.split(/[,，]/).map(x=>x.trim()).filter(Boolean):[],fav:0,stars:null};
    S.items.unshift(r);S.dlg=null;render();toast("上传完成，已进入转换队列。页图生成好会自动变成「进入工作台」。");
    simulate(r.id);},700);}},160);
});
on("[data-retry]",el=>{const r=S.items.find(x=>x.id===el.dataset.retry);r.status="QUEUED";r.pages=48;render();toast("已重新排队。");simulate(r.id);});
on("[data-repdf]",()=>{S.dlg={phase:"form",file:"",size:"",title:"徐汇滨江专项宣发方案",task:"专项宣发方案",tags:"专项"};render();});
on("[data-del]",el=>{S.items=S.items.filter(x=>x.id!==el.dataset.del);render();toast("已删除。");});
on("[data-enter]",(el,e)=>{if(el.getAttribute("aria-disabled")==="true"||el.getAttribute("href")==="#"){e.preventDefault();toast("页图还没生成好，先等一下。");}});
/** 演示转换状态机：排队 → 逐页出图 → 就绪。真实流程由离线转换脚本回写状态。 */
function simulate(id){
  const r=S.items.find(x=>x.id===id);if(!r)return;
  setTimeout(()=>{r.status="PROCESSING";r.done=0;render();
    const t=setInterval(()=>{r.done=Math.min(r.pages,r.done+Math.ceil(r.pages/12));render();
      if(r.done>=r.pages){clearInterval(t);r.status="READY";r.cover="1";r.versions="尚未开始拆解";render();toast("「"+r.title+"」页图已生成，可以进入工作台了。");}},450);},1200);
}
document.addEventListener("click",e=>{
  if(e.target.closest("select,input,textarea,option"))return;
  let best=null,fn=null,depth=-1;
  for(const[sel,f]of H){const el=e.target.closest(sel);if(!el)continue;let d=0,x=el;while(x){d++;x=x.parentElement;}if(d>depth){depth=d;best=el;fn=f;}}
  if(!best)return;
  if(best.tagName==="BUTTON")e.preventDefault();
  fn(best,e);
});
document.addEventListener("input",e=>{
  const q=e.target.closest("[data-q]");
  if(q){S.query=q.value;render();const el=$("[data-q]");el.focus();el.setSelectionRange(el.value.length,el.value.length);return;}
  const f=e.target.closest("[data-f]");if(f&&S.dlg)S.dlg[f.dataset.f]=f.value;
});
document.addEventListener("change",e=>{const f=e.target.closest("[data-f]");if(f&&S.dlg){S.dlg[f.dataset.f]=f.value;}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.dlg&&S.dlg.phase==="form"){S.dlg=null;render();}});
// 让 CASE 03 那份在页面打开后继续往前走，看得见"生成中 → 就绪"
setTimeout(()=>{const r=S.items.find(x=>x.id==="beicai");const t=setInterval(()=>{r.done=Math.min(r.pages,r.done+7);render();if(r.done>=r.pages){clearInterval(t);r.status="READY";r.versions="尚未开始拆解";render();}},900);},2500);
</script>
