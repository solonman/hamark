<!--
  公共视觉域 demo　2026-09-18 初版 ／ 2026-09-19 按全站交互对齐重做（配套 docs/22_公共视觉_立项与实施规格_V0.2.md）

  这一版的原则：能用站里现成的，就长得和它一模一样。
  - 类名、配色变量照抄线上：components/v04/V04Surface.module.css（顶栏、库首页、案例卡、只读详情）、
    components/report/library/ReportLibrary.module.css（4:3 封面、四态封面、上传对话框）、
    components/shared/LibraryToast / DeleteConfirmDialog / ThemeSwitcher、app/globals.css 的 --v04-* 深浅两套。
    实现时直接复用这些类，不要照着 demo 另写一份。
  - 本域新增的只有：子领域筛选、子领域色（--v04-visual-*）、详情页的「舞台 + 素材条」、对话框里的素材排序、
    「补充信息」折叠区。
  - 封面、舞台、大图查看都是深色岛（data-v04-scheme="dark"），浅色主题下仍是深色——站里视频封面、报告页图同一做法。
  - 纯前端，不保存，刷新即回到初始状态；外观偏好存 localStorage（线上存 cookie hm-theme）。
  - 右上角「身份」下拉是 demo 专用，用来看上传者／别人／管理员三种权限；线上这里是 UserMenu。
-->
<script>
  // 首屏前按偏好设好 data-theme，免得先闪一下深色（线上是根布局按 cookie 直接渲染）。
  try {
    const saved = localStorage.getItem("hm-theme");
    if (saved === "light" || saved === "dark" || saved === "system") document.documentElement.dataset.theme = saved;
  } catch (error) { /* 隐私模式读不到就用默认深色 */ }
</script>

/* ---------------- 基础（globals.css + V04Surface .surface） ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--v04-bg); color: var(--v04-ink);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { color: inherit; font: inherit; }

.surface button, .surface a { -webkit-tap-highlight-color: transparent; }

/* ---------------- 顶栏（V04Surface .siteHeader 一组） ---------------- */

}

.themeRoot { position: relative; display: inline-flex; flex: none; }

/* 子领域、按收藏排序、只看我收藏的：都是 V04Surface .weekToggle 那一种药丸，亮起来才说明列表换了口径。 */
.pillToggle { flex: none; border: 1px solid var(--v04-line); border-radius: 999px; background: transparent; color: var(--v04-muted); padding: 9px 14px; font-size: 11px; font-weight: 800; white-space: nowrap; transition: border-color .12s, color .12s, background .12s; }
.pillToggle:hover { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }

.reorderChip { flex: none; border: 1px solid rgb(var(--v04-subject-rgb) / .5); border-radius: 999px; background: transparent; color: var(--v04-subject); padding: 9px 14px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.reorderChip:hover { border-color: rgb(var(--v04-accent-rgb) / .5); color: var(--v04-accent); }
/* 宽度写死 360px + max-width：写成 min(360px,100%) 时，flex 算内容宽度时百分比无从解析，搜索框会被挤到下一行。 */
.librarySearch { position: relative; display: grid; width: 360px; max-width: 100%; }
.librarySearch > span { position: absolute; left: 0; bottom: 13px; color: var(--v04-muted); font-size: 18px; }

/* ---------------- 封面（ReportLibrary .cover 一组：4:3、深色岛、四态） ---------------- */
.cover { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--v04-line); background: #0b0c0a; padding: 0; text-align: left; color: #fff; text-decoration: none; }
.cover::after { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 46%, rgba(0,0,0,.66)); content: ""; pointer-events: none; }
.coverArt { position: absolute; inset: 0; }
.busy .coverArt { filter: saturate(.5) brightness(.55); }
.coverPlaceholder { position: absolute; inset: 0; display: grid; place-items: center; color: #8b8e83; font-size: 12px; background: radial-gradient(circle at 24% 22%, #2a2c24, #15160f 46%, #0b0c0a); }
.coverFormat { position: absolute; top: 12px; left: 12px; z-index: 2; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 4px 9px; font-size: 9px; letter-spacing: .06em; background: rgba(0,0,0,.4); color: #e6e7df; }
.coverPages { position: absolute; right: 12px; bottom: 12px; z-index: 2; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); border-radius: 4px; padding: 2px 7px; }
/* 第一位素材是视频时，照视频库卡片的 .playButton（酸绿实心圆）。 */
.playButton { position: absolute; left: 50%; top: 50%; z-index: 3; display: grid; width: 64px; height: 64px; place-items: center; border-radius: 50%; background: var(--v04-accent-fill); color: var(--v04-on-accent); font-size: 17px; transform: translate(-50%, -50%); }

.coverPlate b { display: -webkit-box; overflow: hidden; color: #fff; font-size: clamp(18px, 2.1vw, 26px); line-height: 1.25; letter-spacing: -.03em; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.coverPlate small { color: rgba(255,255,255,.72); font-size: 10px; letter-spacing: .14em; }

.caseFavoriteOn { border-color: rgb(var(--v04-danger-rgb) / .65); background: rgb(var(--v04-danger-rgb) / .14); color: var(--v04-danger); }
.retryGroup { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.retryButton { border: 1px solid var(--v04-line); border-radius: 999px; background: none; color: var(--v04-muted); padding: 6px 11px; font-size: 10.5px; }
.retryButton:hover:not(:disabled) { border-color: rgb(var(--v04-accent-rgb) / .4); color: var(--v04-accent); }
.retryButtonDanger:hover:not(:disabled) { border-color: rgb(var(--v04-danger-2-rgb) / .5); color: var(--v04-danger-2); }
.caseNumber { margin: 0 0 7px; color: var(--v04-subject); font-size: 9px; font-weight: 900; letter-spacing: .15em; }
.caseTitleStatus h2 { display: grid; gap: 3px; margin: 0; min-width: 0; }
.caseTitleStatus h2 small { color: var(--v04-muted); font-size: 10px; font-weight: 700; }
.caseTitleStatus h2 span { font-size: clamp(21px, 2.4vw, 30px); line-height: 1.05; letter-spacing: -.055em; }
/* 一句话摘要：V04Surface 的 .caseBody > p 那一档，最多两行。 */
.caseSummary { display: -webkit-box; overflow: hidden; margin: 10px 0 0; color: var(--v04-muted); font-size: 13px; line-height: 1.55; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.caseInfoBand { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--v04-line); color: var(--v04-muted); font-size: 9px; }
.caseInfoBand > span { border-radius: 999px; padding: 5px 8px; }
.caseInfoBand > span:not(.caseCategoryTag) { background: var(--v04-raised); }
.caseCategoryTag { border: 1px solid var(--v04-line); }
/* 子领域 chip：位置与报告卡片的「任务类型」chip 一样（信息带第一个），颜色换成子领域色。 */
.subdomainTag { font-weight: 800; }
.subdomainTag[data-sub="OOH"] { border-color: rgb(var(--v04-visual-ooh-rgb) / .45) !important; color: var(--v04-visual-ooh); }
.subdomainTag[data-sub="PUBLIC_ART"] { border-color: rgb(var(--v04-visual-art-rgb) / .45) !important; color: var(--v04-visual-art); }
.subdomainTag[data-sub="RETAIL"] { border-color: rgb(var(--v04-visual-retail-rgb) / .45) !important; color: var(--v04-visual-retail); }

.emptyState { width: min(900px, calc(100% - 48px)); margin: 60px auto; padding: 44px; border: 1px solid var(--v04-line); border-radius: 18px; background: var(--v04-panel); text-align: center; }
.emptyState > span { color: var(--v04-muted); font-size: 26px; }
.emptyState h2 { margin: 0 0 10px; }
.emptyState p { color: var(--v04-muted); }
.emptyState button { display: inline-flex; margin-top: 16px; border: 0; border-radius: 999px; background: var(--v04-accent-fill); color: var(--v04-on-accent); padding: 12px 18px; font-weight: 800; }

/* ---------------- 只读详情（V04Surface .detailHero / .readingModule 一组） ---------------- */
.detailHero { width: min(1160px, calc(100% - 48px)); margin: 0 auto; padding: clamp(38px, 6vw, 82px) 0 30px; }
.breadcrumb { display: flex; gap: 8px; margin: 0 0 44px; color: var(--v04-muted); font-size: 10px; }
.breadcrumb a { color: inherit; text-decoration: none; }
.breadcrumb a:hover { color: var(--v04-accent); }
.breadcrumb b { color: var(--v04-ink); }
.detailEyebrow { margin: 0 0 12px; color: var(--v04-subject); font-size: 10px; font-weight: 900; letter-spacing: .14em; }
/* 标题用 .detailIntro h1 那一档（36–68px）：这里的标题是一句描述，比片名长得多。 */
.detailHero h1 { max-width: 1020px; margin: 0; font-size: clamp(36px, 5vw, 68px); line-height: 1.02; letter-spacing: -.055em; }
.detailSummary { max-width: 720px; margin: 22px 0 0; color: var(--v04-muted); font-size: 15px; line-height: 1.8; }
.detailTags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
.detailTags span { border: 1px solid var(--v04-line); border-radius: 999px; padding: 6px 10px; color: var(--v04-muted); font-size: 9px; }
.detailActions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 24px; }
/* .analysisToolbar button 那一档：细边、10px 字。删除 hover 用报告库的 danger-2。 */
.toolButton { border: 1px solid var(--v04-line); border-radius: 999px; background: transparent; color: var(--v04-ink); padding: 8px 11px; font-size: 10px; }
.toolButton:hover { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }
.toolButtonDanger:hover { border-color: rgb(var(--v04-danger-2-rgb) / .5); color: var(--v04-danger-2); }

/* 舞台 + 素材条：外壳照 .videoShell（圆角 18、#050505），整块是深色岛。 */
.mediaSlot { width: min(1160px, calc(100% - 48px)); margin: 0 auto 36px; }
.videoShell { overflow: hidden; border: 1px solid var(--v04-line); border-radius: 18px; background: #050505; box-shadow: 0 18px 60px rgba(0,0,0,.32); color: var(--v04-ink); }
.stageView { position: relative; aspect-ratio: 16 / 9; background: #050505; }
.stageArt { position: absolute; inset: 0; }
.stageArt.clickable { cursor: zoom-in; }
.stageVeil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.5)); pointer-events: none; }
.stageBig { position: absolute; left: 50%; top: 50%; z-index: 3; display: grid; width: 76px; height: 76px; place-items: center; border: 0; border-radius: 50%; background: var(--v04-accent-fill); color: var(--v04-on-accent); font-size: 20px; transform: translate(-50%, -50%); }
.stagePlaceholder { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; background: radial-gradient(circle at 50% 30%, #383b31, #121310 60%); }
.stagePlaceholder b { color: #e6e7df; font-size: 16px; }
.stagePlaceholder small { color: #a3a69b; font-size: 11px; }
.stagePlaceholder.failed b { color: #ff8f7d; }
.stageTools { position: absolute; top: 12px; right: 12px; z-index: 4; display: flex; gap: 6px; }
.stageTools button, .stageTools a { border: 1px solid rgba(255,255,255,.22); border-radius: 999px; background: rgba(9,10,8,.72); color: #e6e7df; padding: 7px 10px; font-size: 10px; text-decoration: none; }
.stageTools button:hover, .stageTools a:hover { border-color: rgb(var(--v04-accent-rgb) / .5); color: var(--v04-accent); }
.stageNav { position: absolute; top: 50%; z-index: 4; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; background: rgba(9,10,8,.72); color: #e6e7df; font-size: 18px; transform: translateY(-50%); }
.stageNav:hover:not(:disabled) { border-color: rgb(var(--v04-accent-rgb) / .5); color: var(--v04-accent); }
.stageNav:disabled { opacity: .28; cursor: default; }
.stageNav.prev { left: 14px; } .stageNav.next { right: 14px; }
.stageControls { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--v04-line); background: var(--v04-panel-deep); }
.stageControls button { display: grid; width: 32px; height: 32px; flex: none; place-items: center; border: 1px solid var(--v04-line); border-radius: 50%; background: transparent; color: var(--v04-ink); font-size: 11px; }
.stageControls button:hover { border-color: rgb(var(--v04-accent-rgb) / .5); color: var(--v04-accent); }
.stageBar { flex: 1; height: 4px; overflow: hidden; border-radius: 99px; background: var(--v04-raised-2); }
.stageBar i { display: block; width: 0; height: 100%; background: var(--v04-accent); transition: width .3s linear; }
.stageClock { color: var(--v04-muted); font-size: 11px; white-space: nowrap; }
.stageCaption { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; padding: 11px 14px; border-top: 1px solid var(--v04-line); background: var(--v04-panel-deep); color: var(--v04-muted); font-size: 11px; }
.stageCaption b { color: var(--v04-ink); font-weight: 800; }
.mediaStrip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px; background: var(--v04-panel-deep); }
.mediaThumb { position: relative; flex: 0 0 auto; width: 112px; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--v04-line); border-radius: 8px; background: #0b0c0a; padding: 0; }
.mediaThumb .coverArt { transition: filter .15s; }
.mediaThumb[aria-selected="false"] .coverArt { filter: brightness(.72); }
.mediaThumb[aria-selected="true"] { outline: 2px solid var(--v04-accent); outline-offset: -2px; }
.mediaThumb i, .mediaThumb b { position: absolute; z-index: 2; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; font-style: normal; font-weight: 700; color: #fff; background: rgba(0,0,0,.6); border-radius: 4px; padding: 2px 5px; }
.mediaThumb i { left: 5px; top: 5px; }
.mediaThumb b { right: 5px; bottom: 5px; }
.mediaThumb .thumbPending { position: absolute; inset: 0; display: grid; place-items: center; color: #a3a69b; font-size: 9px; background: radial-gradient(circle at 24% 22%, #2a2c24, #15160f 46%, #0b0c0a); }

.readingBody { width: min(1160px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 100px; }
.readingModule { margin: 0 0 22px; border: 1px solid var(--v04-line); border-radius: 18px; background: var(--v04-panel); }
.readingModule > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--v04-line); }
.readingModule > header small { display: block; margin-bottom: 4px; color: var(--v04-muted); font-size: 9px; font-weight: 900; letter-spacing: .17em; }
.readingModule > header h2 { margin: 0; color: var(--v04-subject); font-size: 18px; }
/* 正文：纯文本，保留换行，按文本插入（不走 innerHTML）。 */
.prose { max-width: 72ch; margin: 0; padding: 20px 22px 24px; color: var(--v04-ink-soft); font-size: 14.5px; line-height: 1.95; white-space: pre-wrap; overflow-wrap: anywhere; }
.readingCore { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.readingCore > div { min-width: 0; padding: 18px 22px; border-bottom: 1px solid var(--v04-line); }
.readingCore > div:nth-child(even) { border-left: 1px solid var(--v04-line); }
.readingCore small { display: block; margin-bottom: 6px; color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.readingCore p { margin: 0; color: var(--v04-ink-soft); line-height: 1.65; overflow-wrap: anywhere; }
.readingCore a { color: var(--v04-accent); }
.readingNote { margin: 0; padding: 14px 22px 18px; color: var(--v04-muted); font-size: 11px; line-height: 1.7; }

/* ---------------- 浮层提示（components/shared/LibraryToast.module.css） ---------------- */
.toastStack { position: fixed; left: 50%; bottom: 26px; z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: center; max-width: min(520px, calc(100vw - 32px)); transform: translateX(-50%); pointer-events: none; }
.toastStack > div { border: 1px solid var(--v04-line); border-radius: 12px; background: var(--v04-warn-surface); padding: 9px 15px; font-size: 12px; color: var(--v04-ink); box-shadow: 0 16px 42px rgb(var(--v04-shadow-rgb) / calc(.4 * var(--v04-shadow-strength))); text-align: center; }
.toastStack > div.warn { border-color: rgb(var(--v04-warn-rgb) / .5); background: var(--v04-warn-surface-strong); color: var(--v04-warn-ink); }

/* ---------------- 上传／编辑／删除对话框（ReportLibrary 上传对话框 + DeleteConfirmDialog 同一套壳） ---------------- */
.uploadBackdrop { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--v04-scrim); backdrop-filter: blur(6px); }
.uploadDialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; border: 1px solid var(--v04-line); border-radius: 16px; background: var(--v04-panel); color: var(--v04-ink); }
.uploadHead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--v04-line); background: var(--v04-panel); }
.uploadHead small { display: block; color: var(--v04-subject); font-size: 9px; font-weight: 800; letter-spacing: .14em; }
.uploadHead b { font-size: 14px; }
.uploadClose { margin-left: auto; border: 0; background: none; color: var(--v04-muted); font-size: 18px; line-height: 1; padding: 4px; }
.uploadClose:hover { color: var(--v04-ink); }
.uploadBody { display: grid; gap: 14px; padding: 16px 18px; }
.fileDrop { display: grid; place-items: center; gap: 4px; width: 100%; border: 1px dashed var(--v04-line); border-radius: 12px; padding: 18px; text-align: center; font-size: 11.5px; color: var(--v04-faint); background: none; }
.fileDrop b { color: var(--v04-accent); font-size: 13px; }
.fileDrop:hover { border-color: rgb(var(--v04-accent-rgb) / .4); background: rgb(var(--v04-accent-rgb) / .05); }
.demoPicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: -6px; padding: 10px 12px; border: 1px dashed rgb(var(--v04-subject-rgb) / .45); border-radius: 12px; font-size: 10.5px; color: var(--v04-muted); }
.demoPicker em { flex-basis: 100%; font-style: normal; color: var(--v04-subject); font-size: 10px; font-weight: 800; letter-spacing: .06em; }
.field { display: grid; gap: 5px; }
.field small { color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.field small i { color: var(--v04-muted); font-style: normal; font-weight: 400; }
.field input, .field select { height: 30px; border: 1px solid var(--v04-line); border-radius: 999px; background: var(--v04-sunken); padding: 0 12px; font-size: 12px; color: var(--v04-ink); min-width: 0; }
.field select { appearance: none; background-image: var(--v04-chevron); background-repeat: no-repeat; background-position: right 10px center; background-size: 10px 6px; padding-right: 28px; }
.field textarea { min-height: 96px; border: 1px solid var(--v04-line); border-radius: 12px; background: var(--v04-sunken); padding: 8px 12px; font-size: 12px; line-height: 1.7; color: var(--v04-ink); resize: vertical; }
.field .fieldTip { color: var(--v04-muted); font-size: 10.5px; line-height: 1.5; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { border-left: 3px solid var(--v04-subject); background: rgb(var(--v04-subject-rgb) / .07); padding: 9px 12px; border-radius: 0 9px 9px 0; font-size: 11.5px; line-height: 1.7; color: var(--v04-ink-soft); }
.formError { margin: 0; color: var(--v04-danger); font-size: 11.5px; line-height: 1.6; }
.uploadFooter { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 9px; padding: 12px 18px; border-top: 1px solid var(--v04-line); background: var(--v04-panel); }
.uploadFooter button { border: 1px solid var(--v04-line); border-radius: 999px; background: none; color: var(--v04-ink); padding: 8px 15px; font-size: 12px; }
.uploadFooter button:hover:not(:disabled) { border-color: rgb(var(--v04-accent-rgb) / .4); color: var(--v04-accent); }
.uploadFooter button:disabled { opacity: .4; cursor: not-allowed; }
.uploadFooter .uploadGo { border-color: rgb(var(--v04-accent-rgb) / .4); color: var(--v04-accent); background: rgb(var(--v04-accent-rgb) / .1); }
.uploadProgress { display: grid; gap: 6px; font-size: 11.5px; color: var(--v04-muted); }
.uploadProgress b { color: var(--v04-ink); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.uploadProgress .coverBar { background: rgb(var(--v04-fg-rgb) / .12); }
.failList { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.failList li { display: flex; justify-content: space-between; gap: 10px; border: 1px solid rgb(var(--v04-danger-2-rgb) / .35); border-radius: 10px; padding: 8px 10px; font-size: 11.5px; color: var(--v04-ink-soft); }
.failList li span { color: var(--v04-danger-2); white-space: nowrap; }
.inlineActs { display: flex; flex-wrap: wrap; gap: 8px; }
.inlineActs button, .foldToggle { border: 1px solid var(--v04-line); border-radius: 999px; background: none; color: var(--v04-ink); padding: 7px 13px; font-size: 11.5px; }
.inlineActs button:hover, .foldToggle:hover { border-color: rgb(var(--v04-accent-rgb) / .4); color: var(--v04-accent); }
.inlineActs .primary { border-color: rgb(var(--v04-accent-rgb) / .4); color: var(--v04-accent); background: rgb(var(--v04-accent-rgb) / .1); }
.foldToggle { justify-self: start; color: var(--v04-muted); font-weight: 800; }
.foldToggle[aria-expanded="true"] { color: var(--v04-accent); border-color: rgb(var(--v04-accent-rgb) / .4); }
.subBlock { display: grid; gap: 12px; border: 1px solid var(--v04-line); border-radius: 12px; padding: 12px; }
.subBlock > b { color: var(--v04-subject); font-size: 11px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.check { border: 1px solid var(--v04-line); border-radius: 999px; background: none; color: var(--v04-muted); padding: 5px 10px; font-size: 11px; }
.check:hover { border-color: rgb(var(--v04-accent-rgb) / .4); color: var(--v04-accent); }
.check[aria-pressed="true"] { border-color: rgb(var(--v04-accent-rgb) / .55); background: rgb(var(--v04-accent-rgb) / .12); color: var(--v04-accent); }

/* 对话框里的素材：一条混排列表，第一位就是封面。 */
.mediaList { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.mediaTile { position: relative; aspect-ratio: 1; overflow: hidden; border: 1px solid var(--v04-line); border-radius: 10px; background: #0b0c0a; }
.mediaTile.isCover { outline: 2px solid var(--v04-accent-fill); outline-offset: -2px; }
.mediaTile .idx, .mediaTile .kind, .mediaTile .coverMark { position: absolute; z-index: 2; border-radius: 4px; padding: 2px 5px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; color: #fff; background: rgba(0,0,0,.62); }
.mediaTile .idx { left: 6px; top: 6px; }
.mediaTile .coverMark { left: 6px; top: 6px; background: var(--v04-accent-fill); color: var(--v04-on-accent); font-family: inherit; font-weight: 900; }
.mediaTile .kind { left: 6px; bottom: 34px; }
.mediaTile .kind.bad { color: #ffb3a6; }
.tileActs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: space-between; gap: 4px; padding: 5px; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
.tileActs button { display: grid; width: 24px; height: 24px; place-items: center; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; background: rgba(9,10,8,.8); color: #f0f1ea; font-size: 11px; padding: 0; }
.tileActs button:hover:not(:disabled) { border-color: rgba(223,255,79,.6); color: #dfff4f; }
.tileActs button:disabled { opacity: .3; cursor: default; }
.tileActs .grow { flex: 1; }

.deleteDialog { width: min(460px, 100%); }
.deleteDialog .uploadBody > b { font-size: 14px; }
.deleteDialogLine { margin: 0; color: var(--v04-muted); font-size: 11.5px; line-height: 1.6; }
.uploadFooter .deleteDialogConfirm { border-color: rgb(var(--v04-accent-rgb) / .55); color: var(--v04-accent); }

/* ---------------- 大图查看（报告工作台 .ov / .ovbox / .ovhead 一组） ---------------- */
.ov { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: var(--v04-scrim); backdrop-filter: blur(6px); }
.ovbox { display: flex; width: min(1220px, calc(100vw - 36px)); height: min(880px, calc(100vh - 36px)); flex-direction: column; overflow: hidden; border: 1px solid var(--v04-line); border-radius: 16px; background: var(--v04-panel); color: var(--v04-ink); }
.ovhead { display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-bottom: 1px solid var(--v04-line); }
.ovhead b { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--v04-subject); font-size: 12px; white-space: nowrap; }
.ovheadT { flex: 1; overflow: hidden; color: var(--v04-muted); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
.smBtn { border: 1px solid var(--v04-line); border-radius: 999px; background: transparent; color: var(--v04-ink); padding: 6px 11px; font-size: 10.5px; white-space: nowrap; }
.smBtn:hover:not(:disabled) { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }
.smBtn:disabled { opacity: .35; cursor: default; }
.viewerBody { position: relative; display: grid; flex: 1; min-height: 0; place-items: center; padding: 20px 70px; background: #080907; }
.viewerImage { position: relative; width: min(100%, calc((min(880px, 100vh - 36px) - 100px) * 4 / 3)); aspect-ratio: 4 / 3; border: 1px solid var(--v04-line); }

@media (max-width: 620px) {
  .siteHeader { grid-template-columns: 1fr auto; min-height: 58px; gap: 7px; padding: 8px 12px; }
  .siteNav { order: 3; grid-column: 1 / -1; justify-content: flex-start; overflow-x: auto; }
  .headerCaseTitle { flex: 1 0 min(62vw, 230px); max-width: min(62vw, 230px); }
  .brandWordmark span { font-size: 13px; }
  .viewerSwitch > span { display: none; }
  .libraryHero, .libraryToolbar, .caseGrid, .detailHero, .mediaSlot, .readingBody { width: calc(100% - 24px); }
  .libraryHero { padding: 42px 0 26px; }
  .libraryHero h1 { font-size: 52px; }
  .libraryToolbar { align-items: stretch; flex-direction: column; }
  .libraryToolbarControls { align-items: stretch; justify-content: flex-start; }
  .librarySearch { width: 100%; }
  .caseGrid { grid-template-columns: 1fr; }
  .caseCardMetrics { margin-left: 0; }
  .detailHero h1 { font-size: 34px; }
  .readingCore { grid-template-columns: 1fr; }
  .readingCore > div:nth-child(even) { border-left: 0; }
  .stageNav { width: 34px; height: 34px; }
  .viewerBody { padding: 12px 44px; }

  if (kind === "light") return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.9"/><path d="M8 1.4v1.5M8 13.1v1.5M1.4 8h1.5M13.1 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M3.3 12.7l1.1-1.1M11.6 4.4l1.1-1.1"/></svg>`;
  if (kind === "dark") return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 10.1A5.6 5.6 0 0 1 5.9 2.6a5.6 5.6 0 1 0 7.5 7.5Z"/></svg>`;
  return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.6" width="12.4" height="8.6" rx="1.4"/><path d="M5.6 14h4.8M8 11.2V14"/></svg>`;
}
function themeSwitcherHTML() {
  const pref = themePreference();
  const label = `外观：${THEME_LABELS[pref]}`;
  return `<div class="themeRoot" data-theme-switcher>
    <button type="button" class="trigger" aria-haspopup="menu" aria-expanded="${state.themeOpen}" aria-label="${label}" title="${label}" data-action="theme-toggle">${themeIcon(pref)}</button>
    ${state.themeOpen ? `<div class="popover"><p class="heading" aria-hidden="true">外观</p><div role="menu" aria-label="外观">
      ${THEME_PREFERENCES.map((option) => `<button type="button" role="menuitemradio" aria-checked="${pref === option}" class="option" data-theme-pick="${option}">
        ${themeIcon(option)}<span>${THEME_LABELS[option]}${option === "system" ? "<small>按电脑的深浅设置自动切换</small>" : ""}</span>${pref === option ? `<b aria-hidden="true">✓</b>` : ""}
      </button>`).join("")}
    </div></div>` : ""}
  </div>`;
}
function chooseTheme(option) {
  document.documentElement.dataset.theme = option;
  try { localStorage.setItem("hm-theme", option); } catch (error) { /* 忽略 */ }
  state.themeOpen = false;
  renderHeader();
  $("[data-theme-switcher] .trigger")?.focus();
}

}
function renderHeader() {

  const header = $("#siteHeader");
  if (!header) return;
  if (route.caseId) {

      <div class="siteUtilities">${themeSwitcherHTML()}${viewerSwitchHTML()}</div>`;
  } else {
    header.innerHTML = `<a href="#" class="brandWordmark" data-action="go-list"><b>R:</b><span>RE:VERSE</span><small>反写</small></a>

/* ============================================================
   路由：#/visual/<id> 对应线上 /visual/[id]；其余是库首页（?library=VISUAL）。
   路由记在内存里，地址栏用 pushState 同步——以 data: 方式打开时浏览器不许改地址，
   那时只是不写地址栏，页面照常切换。
   ============================================================ */
const route = { caseId: parseHash() };
function parseHash() {
  const match = location.hash.match(/^#\/visual\/([\w-]+)$/);
  return match ? match[1] : null;
}
function currentRoute() { return route; }
function navigate(caseId, push) {
  stopPlay();
  state.stageIndex = 0;
  if (state.overlay) closeOverlay();
  route.caseId = caseId;
  if (push) {
    try { history.pushState({ caseId }, "", caseId ? `#/visual/${caseId}` : `${location.pathname}${location.search}`); } catch (error) { /* data: 地址不许改，忽略 */ }
  }
  render();
  jumpTo(caseId ? 0 : state.listScroll);
}
function goList() {
  if (route.caseId) navigate(null, true);
  else render();
}
function openCase(id) {
  state.listScroll = window.scrollY;
  navigate(id, true);
}

/* ============================================================
   库首页
   ============================================================ */
function ranking(list) {
  return [...list].sort((a, b) => favCount(b) - favCount(a) || new Date(b.at) - new Date(a.at));
}
/** 按收藏排序时名次冻结：点心形只改数字，不让卡片从鼠标底下窜走（与视频库「按周显示」同一做法）。 */
function freezeOrder() { state.frozen = new Map(ranking(CASES).map((item, index) => [item.id, index])); }
function visibleCases() {
  const q = norm(state.composing ? state.committedQuery : state.query).trim();
  let list = byNewest();
  if (state.sub !== "ALL") list = list.filter((item) => item.sub === state.sub);
  if (state.mine) list = list.filter((item) => faved(item));
  if (q) {
    list = list.filter((item) => norm([item.title, item.summary, item.location, item.creator, item.tags.join(" "), item.text, nameOf(item.by)].join(" ")).includes(q));
  }
  let stale = false;
  if (state.sortFav && state.frozen) {
    const rankOf = (item) => (state.frozen.has(item.id) ? state.frozen.get(item.id) : -1);
    const frozenList = [...list].sort((a, b) => rankOf(a) - rankOf(b));
    const liveIds = ranking(list).map((item) => item.id).join();
    stale = frozenList.map((item) => item.id).join() !== liveIds;
    list = frozenList;
  }
  return { list, stale };
}

function heartSVG(on) {
  return `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 13.7 3.2 9.1a3.1 3.1 0 0 1 0-4.5 3.3 3.3 0 0 1 4.6 0L8 4.8l.2-.2a3.3 3.3 0 0 1 4.6 0 3.1 3.1 0 0 1 0 4.5L8 13.7Z" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}
function favoriteButtonHTML(item) {
  const ready = item.status === "READY";
  const on = faved(item);
  const count = favCount(item);
  const title = !ready ? "案例还没上传完，暂时不能收藏" : on ? "已收藏，再点一次取消" : "收藏（不限数量，只是给自己留档）";
  return `<button type="button" class="caseFavorite${on ? " caseFavoriteOn" : ""}" aria-pressed="${on}"
    aria-label="${on ? "取消收藏" : "收藏"}《${esc(item.title)}》，当前 ${count} 人收藏" title="${title}"${ready ? "" : " disabled"} data-action="favorite" data-id="${item.id}">${heartSVG(on)}<b>${count}</b></button>`;
}

function coverInnerHTML(item) {
  const parts = carrierParts(item);
  const badge = parts.length ? `<span class="coverFormat">${esc(parts.join(" · "))}</span>` : "";
  if (item.status === "UPLOADING") {
    const missing = item.assets.filter((asset) => asset.upload === "MISSING").length;
    const first = item.assets.find((asset) => asset.upload === "READY");
    return `${first ? `<div class="coverArt" style="background:${artOf(first.art)}"></div>` : `<div class="coverPlaceholder">没有预览</div>`}${badge}
      <div class="coverState"><b>上传未完成</b><small>${item.assets.length} 个文件里有 ${missing} 个没传完${canManage(item) ? "，点「继续上传」补传或去掉" : ""}</small></div>`;
  }
  const first = shownAssets(item)[0];
  if (!first) {
    return `<div class="coverPlate"><b>${esc(item.title)}</b><small>纯文字案例</small></div>${badge}`;
  }
  if (first.deriv === "PENDING") {
    return `<div class="coverPlaceholder">等待生成预览</div>${badge}<div class="coverState"><b>正在生成预览</b><small>上传已完成，缩略图生成后自动出现</small><div class="coverBar"><i style="width:40%"></i></div></div>`;
  }
  if (first.deriv === "FAILED") {
    return `<div class="coverPlaceholder">没有预览</div>${badge}<div class="coverState coverStateFailed"><b>预览生成失败</b><small>${esc(derivFailReason(first))}</small></div>`;
  }
  const video = first.type === "VIDEO";
  return `<div class="coverArt" style="background:${artOf(first.art)}"></div>${badge}${video ? `<span class="playButton" aria-hidden="true">▶</span><span class="coverPages">${fmtDur(first.dur)}</span>` : ""}`;
}
const derivFailReason = (asset) => (asset.sizeMB > LIMITS.derivativeMB ? `原图 ${asset.sizeMB} MB，超过 ${LIMITS.derivativeMB} MB 的处理上限；可以查看原图` : "处理失败；可以查看原图");

function caseCardHTML(item) {
  const ready = item.status === "READY";
  const manage = canManage(item);
  const cover = ready
    ? `<a class="cover" href="#/visual/${item.id}" data-v04-scheme="dark" data-action="open" data-id="${item.id}" aria-label="查看《${esc(item.title)}》">${coverInnerHTML(item)}</a>`
    : `<button type="button" class="cover busy" data-v04-scheme="dark" data-action="not-ready" aria-label="《${esc(item.title)}》上传未完成">${coverInnerHTML(item)}</button>`;
  let actions;
  if (ready) actions = `<a class="caseEnterPill" href="#/visual/${item.id}" data-action="open" data-id="${item.id}">查看案例</a>`;
  else if (manage) actions = `<span class="retryGroup"><button type="button" class="retryButton" data-action="resume" data-id="${item.id}">继续上传</button><button type="button" class="retryButton retryButtonDanger" data-action="delete" data-id="${item.id}">删除</button></span>`;
  else actions = `<button type="button" class="enterPillDisabled" aria-disabled="true" data-action="not-ready">上传未完成</button>`;
  return `<article class="caseCard" data-case-id="${item.id}" data-status="${item.status}">
    ${cover}
    <div class="caseBody">
      <div class="caseQuickActions">${actions}<div class="caseCardMetrics">${favoriteButtonHTML(item)}</div></div>
      <p class="caseNumber">CASE ${pad(caseNumberOf(item.id))}</p>
      <div class="caseTitleStatus"><h2><small>${esc(item.creator || "未标注创作方")}</small><span>${esc(item.title)}</span></h2></div>
      ${item.summary ? `<p class="caseSummary">${esc(item.summary)}</p>` : ""}
      <div class="caseInfoBand">
        <span class="caseCategoryTag subdomainTag" data-sub="${item.sub}">${SUBS[item.sub].label}</span>
        <span>上传者 ${esc(nameOf(item.by))} · ${fmtTime(item.at)}</span>
        ${item.location ? `<span>${esc(item.location)}</span>` : ""}
        ${item.tags.map((tag) => `<span class="caseCategoryTag">#${esc(tag)}</span>`).join("")}
      </div>
    </div>
  </article>`;
}

function renderLibrary() {
  const { list, stale } = visibleCases();
  let body;
  if (!list.length && state.mine && state.sub === "ALL" && !norm(state.query).trim()) {
    body = `<section class="emptyState"><span>♡</span><h2>你还没有收藏案例</h2><p>在卡片上点心形就能收藏，不限数量，只给自己留档。</p><button type="button" data-action="clear-filters">看全部案例</button></section>`;
  } else if (!list.length) {
    body = `<section class="emptyState"><span>⌕</span><h2>没有找到对应案例</h2><p>换一个标题、地点、创作方或标签，或者清掉子领域筛选。</p><button type="button" data-action="clear-filters">清空搜索和筛选</button></section>`;
  } else {
    body = `<section class="caseGrid" aria-label="案例列表">${list.map(caseCardHTML).join("")}</section>`;
  }
  $("#page").innerHTML = `
    <section class="libraryHero"><p>PUBLIC VISUAL COLLECTION</p><h1>把街上值得被记住的，<br>收进来。</h1><span>户外广告、公共艺术、商业展陈。</span></section>
    <section class="libraryToolbar">
      <div><p>PUBLIC VISUAL LIBRARY<span class="libraryCount"> · ${countLabel(list.length, CASES.length, "条")}</span></p><h2>公共视觉库</h2></div>
      <div class="libraryToolbarControls">
        <div class="filterGroup" role="radiogroup" aria-label="子领域">
          ${[["ALL", "全部"], ...SUB_KEYS.map((key) => [key, SUBS[key].label])].map(([key, label]) => `<button type="button" class="pillToggle" role="radio" aria-checked="${state.sub === key}" data-action="sub" data-sub="${key}">${label}</button>`).join("")}
        </div>
        <button type="button" class="pillToggle" aria-pressed="${state.sortFav}" title="按收藏数从多到少；打开那一刻的名次会冻结，点心形不会让卡片挪位" data-action="sort-fav">按收藏排序</button>
        ${state.sortFav && stale ? `<button type="button" class="reorderChip" title="收藏数已变化，点此按新的收藏数重新排序" data-action="reorder">顺序已变 · 重新排序</button>` : ""}
        <button type="button" class="pillToggle" aria-pressed="${state.mine}" title="只看我收藏过的案例" data-action="mine">只看我收藏的</button>
        <label class="librarySearch"><span aria-hidden="true">⌕</span><input id="search" aria-label="搜索案例" value="${esc(state.query)}" placeholder="搜索标题、地点、创作方或标签"></label>
      </div>
    </section>
    ${body}`;
  bindSearch();
}
function bindSearch() {
  const input = $("#search");
  if (!input) return;
  input.addEventListener("compositionstart", () => { state.composing = true; });
  input.addEventListener("compositionend", (event) => {
    state.composing = false;
    state.query = event.target.value; state.committedQuery = event.target.value;
    rerenderLibraryKeepingSearchFocus();
  });
  input.addEventListener("input", (event) => {
    state.query = event.target.value;
    if (!state.composing) { state.committedQuery = event.target.value; rerenderLibraryKeepingSearchFocus(); }
  });
}
function rerenderLibraryKeepingSearchFocus() {
  const caret = $("#search")?.selectionStart ?? state.query.length;
  renderLibrary();
  const input = $("#search");
  input.focus();
  input.setSelectionRange(caret, caret);
}

/* 收藏：心先跳，请求在后台跑；同一张卡片上一次没回来就不再发（与视频库 toggleFavorite 同一套）。 */
function toggleFavorite(id) {
  const item = findCase(id);
  if (!item || item.status !== "READY" || state.favoriteInFlight.has(id)) return;
  state.favoriteInFlight.add(id);
  if (faved(item)) item.favedBy.delete(state.viewer); else item.favedBy.add(state.viewer);
  refreshFavoriteButtons(id);
  setTimeout(() => {
    state.favoriteInFlight.delete(id);
    // 服务端回来：计数以服务端为准（demo 里就是本地值）。收藏列表与排序提示可能要跟着变。
    if (!currentRoute().caseId) renderLibraryPreservingScroll();
  }, 320);
}
function refreshFavoriteButtons(id) {
  const item = findCase(id);
  $$(`[data-action="favorite"][data-id="${id}"]`).forEach((button) => { button.outerHTML = favoriteButtonHTML(item); });
}
function renderLibraryPreservingScroll() {
  const y = window.scrollY;
  const active = document.activeElement;
  const focusKey = active?.id === "search" ? "#search"
    : active?.dataset?.action ? `[data-action="${active.dataset.action}"]${active.dataset.id ? `[data-id="${active.dataset.id}"]` : ""}${active.dataset.sub ? `[data-sub="${active.dataset.sub}"]` : ""}`
    : "";
  renderLibrary();
  jumpTo(y);
  if (focusKey) $(focusKey)?.focus({ preventScroll: true });
}

/* ============================================================
   详情
   ============================================================ */
function renderDetail(id) {
  const item = findCase(id);
  if (!item || item.status !== "READY") {
    $("#page").innerHTML = `<section class="emptyState"><h2>${item ? "这条案例还在上传" : "案例不存在或已移入回收站"}</h2><p>${item ? "上传完成后才能查看。" : "回收站里的案例由上传者或系统管理员恢复。"}</p><button type="button" data-action="go-list">返回公共视觉库</button></section>`;
    return;
  }
  if (state.stageIndex >= shownAssets(item).length) state.stageIndex = 0;
  const manage = canManage(item);
  const missing = item.assets.filter((asset) => asset.upload === "MISSING").length;
  const eyebrow = [SUBS[item.sub].label, item.location, item.occ].filter(Boolean).join(" · ");
  $("#page").innerHTML = `
    <section class="detailHero">
      <p class="breadcrumb"><a href="#" data-action="go-list">公共视觉库</a><span>/</span><b>案例</b></p>
      <p class="detailEyebrow">${esc(eyebrow)}</p>
      <h1>${esc(item.title)}</h1>
      ${item.summary ? `<p class="detailSummary">${esc(item.summary)}</p>` : ""}
      <div class="detailTags">
        <span class="subdomainTag" data-sub="${item.sub}">${SUBS[item.sub].label}</span>
        ${carrierParts(item).length ? `<span>${esc(carrierParts(item).join(" · "))}</span>` : ""}
        ${item.tags.map((tag) => `<span>#${esc(tag)}</span>`).join("")}
        <span>上传者 ${esc(nameOf(item.by))} · ${fmtTime(item.at)}</span>
      </div>
      <div class="detailActions">
        ${favoriteButtonHTML(item)}
        ${manage && missing ? `<button type="button" class="toolButton" data-action="resume" data-id="${item.id}">有 ${missing} 个新素材没传完 · 继续上传</button>` : ""}
        ${manage ? `<button type="button" class="toolButton" data-action="edit" data-id="${item.id}">编辑信息与素材</button><button type="button" class="toolButton toolButtonDanger" data-action="delete" data-id="${item.id}">删除案例</button>` : ""}
      </div>
    </section>
    ${shownAssets(item).length ? `<section class="mediaSlot" aria-label="素材"><div class="videoShell" data-v04-scheme="dark" id="stage">${stageHTML(item)}</div></section>` : ""}
    <div class="readingBody">
      ${item.text.trim() ? `<section class="readingModule"><header><div><small>TEXT</small><h2>正文</h2></div></header><p class="prose" id="prose"></p></section>` : ""}
      <section class="readingModule"><header><div><small>DETAILS</small><h2>案例信息</h2></div></header>
        <div class="readingCore">${infoRowsHTML(item)}</div>
        <p class="readingNote">仅公司内部学习使用，不对外公开分享。图片先看 480w 缩略图与 1600w 展示图，「查看原图」才读取原始文件。</p>
      </section>
    </div>`;
  const prose = $("#prose");
  if (prose) prose.textContent = item.text; // 纯文本：按文本插入，不解析任何标记
}

function infoRowsHTML(item) {
  const rows = [
    ["采集地点", item.location],
    ["创作方／品牌", item.creator],
    ["投放／落成时间", item.occ],
    ["来源", item.url && isHttpUrl(item.url) ? { link: item.url } : ""],
    ["版权／拍摄说明", item.rights],
  ];
  for (const field of SUBS[item.sub].fields) {
    const value = (item.meta || {})[field.key];
    rows.push([field.label, Array.isArray(value) ? value.join("、") : value]);
  }
  return rows.filter(([, value]) => value && (typeof value !== "string" || value.trim()))
    .map(([label, value]) => `<div><small>${esc(label)}</small><p>${typeof value === "object" ? `<a href="${esc(value.link)}" target="_blank" rel="noopener noreferrer">${esc(value.link)}</a>` : esc(value)}</p></div>`)
    .join("");
}

/* 舞台 + 素材条：所有素材按上传顺序排成一条；首屏是第一位素材；点哪格看哪格。 */
function stageHTML(item) {
  const assets = shownAssets(item);
  const index = state.stageIndex;
  const asset = assets[index];
  const images = assets.filter((entry) => entry.type === "IMAGE");
  let view;
  if (asset.type === "VIDEO") {
    view = `<div class="stageArt" style="background:${artOf(asset.art)}"></div><div class="stageVeil"></div>
      ${state.playing ? "" : `<button type="button" class="stageBig" aria-label="播放 ${esc(asset.name)}" data-action="play">▶</button>`}`;
  } else if (asset.deriv === "PENDING") {
    view = `<div class="stagePlaceholder"><b>正在生成预览</b><small>上传已完成，展示图生成后自动出现</small></div>`;
  } else if (asset.deriv === "FAILED") {
    view = `<div class="stagePlaceholder failed"><b>预览生成失败</b><small>${esc(derivFailReason(asset))}</small></div>`;
  } else {
    view = `<div class="stageArt clickable" style="background:${artOf(asset.art)}" data-action="viewer" data-image="${images.indexOf(asset)}" title="全屏查看"></div>`;
  }
  const tools = asset.type === "IMAGE"
    ? `<div class="stageTools">${asset.deriv === "READY" ? `<button type="button" data-action="viewer" data-image="${images.indexOf(asset)}">全屏查看</button>` : ""}<button type="button" data-action="original" data-id="${asset.id}">查看原图</button></div>`
    : "";
  const nav = assets.length > 1
    ? `<button type="button" class="stageNav prev" aria-label="上一个素材" data-action="stage-step" data-step="-1"${index === 0 ? " disabled" : ""}>‹</button><button type="button" class="stageNav next" aria-label="下一个素材" data-action="stage-step" data-step="1"${index === assets.length - 1 ? " disabled" : ""}>›</button>`
    : "";
  const controls = asset.type === "VIDEO"
    ? `<div class="stageControls"><button type="button" aria-label="${state.playing ? "暂停" : "播放"}" data-action="play">${state.playing ? "❚❚" : "▶"}</button><div class="stageBar"><i id="stageBarFill" style="width:${Math.min(100, (state.playAt / asset.dur) * 100)}%"></i></div><span class="stageClock mono" id="stageClock">${fmtDur(state.playAt)} / ${fmtDur(asset.dur)}</span></div>`
    : "";
  const caption = `<div class="stageCaption"><span><b>${pad(index + 1)} / ${pad(assets.length)}</b> · ${asset.type === "VIDEO" ? `视频 · ${esc(asset.name)} · ${fmtDur(asset.dur)}` : `图片${asset.fmt === "HEIC" ? " · HEIC 原图" : ""}`}</span>${assets.length > 1 ? `<span>点缩略图切换，焦点在缩略图上时可用 ← →</span>` : ""}</div>`;
  const strip = assets.length > 1
    ? `<div class="mediaStrip" role="tablist" aria-label="全部素材（按上传顺序）">${assets.map((entry, i) => `<button type="button" class="mediaThumb" role="tab" aria-selected="${i === index}" tabindex="${i === index ? 0 : -1}" aria-label="第 ${i + 1} 个素材：${entry.type === "VIDEO" ? `视频 ${esc(entry.name)}` : "图片"}" data-action="stage-go" data-index="${i}">
        ${entry.type === "IMAGE" && entry.deriv !== "READY" ? `<span class="thumbPending">${entry.deriv === "FAILED" ? "无预览" : "生成中"}</span>` : `<span class="coverArt" style="background:${artOf(entry.art)}"></span>`}
        <i>${pad(i + 1)}</i>${entry.type === "VIDEO" ? `<b>▶ ${fmtDur(entry.dur)}</b>` : ""}
      </button>`).join("")}</div>`
    : "";
  return `<div class="stageView">${view}${tools}${nav}</div>${controls}${caption}${strip}`;
}
function rerenderStage(focusStrip) {
  const item = findCase(currentRoute().caseId);
  const stage = $("#stage");
  if (!item || !stage) return;
  stage.innerHTML = stageHTML(item);
  if (focusStrip) $(".mediaThumb[aria-selected='true']")?.focus();
}
function stageGo(index, focusStrip) {
  const item = findCase(currentRoute().caseId);
  if (!item) return;
  const next = Math.max(0, Math.min(shownAssets(item).length - 1, index));
  if (next === state.stageIndex) return;
  stopPlay();
  state.stageIndex = next;
  rerenderStage(focusStrip);
}
function togglePlay() {
  const item = findCase(currentRoute().caseId);
  const asset = item && shownAssets(item)[state.stageIndex];
  if (!asset || asset.type !== "VIDEO") return;
  state.playing = !state.playing;
  clearInterval(state.playTimer);
  if (state.playing) {
    if (state.playAt >= asset.dur) state.playAt = 0;
    notify("demo 没有真实视频，只演示播放状态");
    state.playTimer = setInterval(() => {
      state.playAt = Math.min(asset.dur, state.playAt + 0.5);
      if (state.playAt >= asset.dur) { state.playing = false; clearInterval(state.playTimer); rerenderStage(); return; }
      const fill = $("#stageBarFill"); const clock = $("#stageClock");
      if (fill) fill.style.width = `${(state.playAt / asset.dur) * 100}%`;
      if (clock) clock.textContent = `${fmtDur(state.playAt)} / ${fmtDur(asset.dur)}`;
    }, 500);
  }
  rerenderStage();
}
function stopPlay() { state.playing = false; state.playAt = 0; clearInterval(state.playTimer); state.playTimer = null; }

/* ============================================================
   浮层：大图查看、删除确认、上传／编辑。全部渲染进 #overlay，
   键盘监听只在文件底部挂一次（Esc、←→ 都在那里分派），不会随开关叠加。

function lockScroll(on) { document.body.style.overflow = on ? "hidden" : ""; }
function closeOverlay() {
  const previous = state.overlay;
  state.overlay = null;

}

/* ---------- 大图查看（报告工作台页面 modal 的 ←→ / Esc，首尾不回绕） ---------- */

  state.overlay = { kind: "viewer", caseId: item.id, index: Math.max(0, Math.min(images.length - 1, imageIndex)), returnFocus: document.activeElement };

}
function renderViewer() {
  const overlay = state.overlay;

  $("#overlay").innerHTML = `<div class="ov" data-backdrop="viewer">
    <div class="ovbox" role="dialog" aria-modal="true" aria-label="查看图片：${esc(item.title)}">

/** 表单输入直接写进草稿，不整体重画（保住光标）；结构性变化（加删挪素材、换子领域、展开）才重画。 */
function onDraftInput(target) {
  const overlay = state.overlay;
  if (!overlay || overlay.kind !== "upload" || !overlay.draft) return;
  const d = overlay.draft;
  if (target.dataset.draft) {
    const key = target.dataset.draft;
    if (key === "sub") {
      d.sub = target.value;
      // 换子领域：旧子领域的专有字段整组丢掉——服务端也会把不属于当前子领域的键当未知键拒绝
      const allowed = new Set((SUBS[d.sub]?.fields || []).map((field) => field.key));
      d.meta = Object.fromEntries(Object.entries(d.meta).filter(([key2]) => allowed.has(key2)));
      overlay.dirty = true;
      renderUpload();
      $("#f-sub")?.focus();
      return;
    }
    d[key] = target.value;
  } else if (target.dataset.meta) {
    d.meta[target.dataset.meta] = target.value;
  } else return;
  overlay.dirty = true;
}

let pickCounter = 0;
function pickFiles(kind) {
  const d = state.overlay.draft;
  const videos = d.assets.filter((asset) => asset.type === "VIDEO").length;
  const images = d.assets.filter((asset) => asset.type === "IMAGE").length;
  const pool = ["led", "blue", "steel", "mirror", "orange", "mist", "garden", "paper", "grey", "night"];
  const pick = () => pool[(pickCounter++ * 3) % pool.length];
  const add = [];
  if (kind === "video") {
    if (videos >= LIMITS.videos) return notify(`单条案例最多 ${LIMITS.videos} 段视频`, "warn");
    add.push({ id: `n${nextId()}`, type: "VIDEO", art: ["night", "mist", "led"][pickCounter++ % 3], dur: 40 + (pickCounter % 5) * 13, name: `现场_${pickCounter}.mp4`, sizeMB: 120, upload: "READY", deriv: "READY" });
  } else {
    const count = kind === "images" ? 3 : 1;
    const room = LIMITS.images - images;
    if (room <= 0) return notify(`单条案例最多 ${LIMITS.images} 张图片`, "warn");
    for (let i = 0; i < Math.min(count, room); i++) {
      const base = { id: `n${nextId()}`, type: "IMAGE", art: pick(), fmt: "JPG", sizeMB: 3.6, upload: "READY", deriv: "READY" };
      base.name = `IMG_${2200 + pickCounter}.jpg`;
      if (kind === "heic") Object.assign(base, { fmt: "HEIC", name: `IMG_${2200 + pickCounter}.HEIC`, sizeMB: 2.9 });
      if (kind === "big") Object.assign(base, { name: `DSC_${pickCounter}.jpg`, sizeMB: 26.3 });
      if (kind === "fail") base.failOnUpload = true;
      add.push(base);
    }
    if (count > room) notify(`单条案例最多 ${LIMITS.images} 张图片，多出来的没有加进来`, "warn");
  }
  d.assets.push(...add);
  state.overlay.dirty = true;
  renderUpload();
}
function mediaOp(action, index, step) {
  const list = state.overlay.draft.assets;
  if (action === "remove") list.splice(index, 1);
  if (action === "cover" && index > 0) list.unshift(...list.splice(index, 1));
  if (action === "move") {
    const to = index + step;
    if (to < 0 || to >= list.length) return;
    [list[index], list[to]] = [list[to], list[index]];
  }
  state.overlay.dirty = true;
  renderUpload();
}
function toggleMetaMany(key, value) {
  const meta = state.overlay.draft.meta;
  const current = Array.isArray(meta[key]) ? [...meta[key]] : [];
  const index = current.indexOf(value);
  if (index >= 0) current.splice(index, 1); else current.push(value);
  meta[key] = current; // 多选一律存字符串数组
  state.overlay.dirty = true;
  renderUpload();
}

function validateDraft(d) {
  if (!d.sub) return "请选择子领域。";
  if (!d.title.trim()) return "请填写标题。";
  if (!d.location.trim()) return "请填写采集地点，写到城市即可。";
  const tags = parseTags(d.tags);
  if (!tags.length) return "至少填一个标签。";
  if (tags.length > LIMITS.tags) return `标签最多 ${LIMITS.tags} 个。`;
  if (tags.some((tag) => tag.length > LIMITS.tagLength)) return `每个标签不超过 ${LIMITS.tagLength} 个字。`;
  if (!d.assets.length && !d.text.trim()) return "至少要有一段视频、一张图片或一段正文。";
  if (d.url.trim() && !isHttpUrl(d.url.trim())) return "来源链接只收 http:// 或 https:// 开头的网址。";
  return "";
}
function submitDraft() {
  const overlay = state.overlay;
  const d = overlay.draft;
  const error = validateDraft(d);
  if (error) {
    overlay.error = error;
    if (error.startsWith("来源链接")) overlay.fold = true;
    renderUpload();
    $(".formError")?.scrollIntoView({ block: "nearest" });
    return;
  }
  overlay.error = "";
  const fields = {
    sub: d.sub, title: d.title.trim(), location: d.location.trim(), tags: parseTags(d.tags), text: d.text,
    creator: d.creator.trim(), occ: d.occ.trim(), url: d.url.trim(), summary: d.summary.trim(), rights: d.rights.trim() || "仅公司内部学习使用",
    meta: pruneMeta(d.sub, d.meta),
  };
  const fresh = d.assets.filter((asset) => !asset.existing);
  if (overlay.mode === "edit") {
    const item = findCase(overlay.caseId);
    Object.assign(item, fields);
    // 素材按对话框里的顺序整体写回（position 由这个顺序决定，不按类型重排）
    item.assets = d.assets.map((asset) => {
      const { existing, failOnUpload, ...rest } = asset;
      return existing ? rest : { ...rest, upload: "MISSING", deriv: rest.type === "IMAGE" ? "PENDING" : "READY", failOnUpload };
    });
    if (!fresh.length) { closeOverlay(); notify("已保存修改"); render(); return; }
    uploadAssets(item, fresh.map((asset) => asset.id), () => finishUpload(item));
    return;
  }
  // 新建：服务端建条目（UPLOADING），素材逐个签发链接、逐个直传，最后 complete
  const item = {
    id: `vc-${nextId()}`, status: fields.text && !d.assets.length ? "READY" : "UPLOADING", ...fields,
    assets: d.assets.map(({ failOnUpload, existing, ...rest }) => ({ ...rest, upload: "MISSING", deriv: rest.type === "IMAGE" ? "PENDING" : "READY", failOnUpload })),
    by: state.viewer, at: new Date().toISOString(), favBase: 0, favedBy: new Set(),
  };
  CASES.push(item);
  if (!item.assets.length) { closeOverlay(); notify("已发布纯文字案例"); render(); return; }
  uploadAssets(item, item.assets.map((asset) => asset.id), () => finishUpload(item));
}
function pruneMeta(sub, meta) {
  const allowed = new Set(SUBS[sub].fields.map((field) => field.key));
  const out = {};
  for (const [key, value] of Object.entries(meta)) {
    if (!allowed.has(key)) continue;
    if (Array.isArray(value) ? value.length : String(value).trim()) out[key] = Array.isArray(value) ? value : String(value).trim();
  }
  return out;
}
/** 逐个上传；失败的记下来，进入「有几个没传上」那一步，而不是整条案例判死。 */
function uploadAssets(item, ids, onDone) {
  const overlay = state.overlay;
  overlay.phase = "uploading";
  overlay.caseId = item.id;
  const queue = ids.map((id) => item.assets.find((asset) => asset.id === id));
  const failed = [];
  let i = 0;
  const step = () => {
    if (i >= queue.length) {
      if (failed.length) { overlay.phase = "partial"; overlay.failed = failed; overlay.error = ""; renderUpload(); render(); return; }
      onDone();
      return;
    }
    const asset = queue[i];
    overlay.progress = { done: i, total: queue.length, name: asset.name, pct: 0 };
    renderUpload();
    let pct = 0;
    const timer = setInterval(() => {
      pct += 34;
      if (asset.failOnUpload && pct >= 68) {
        clearInterval(timer); asset.upload = "MISSING"; failed.push(asset.id); i++; step(); return;
      }
      if (pct >= 100) { clearInterval(timer); asset.upload = "READY"; i++; step(); return; }
      overlay.progress.pct = pct;
      renderUpload();
    }, 110);
  };
  step();
}
function finishUpload(item) {
  item.status = "READY";
  const pending = item.assets.some((asset) => asset.deriv === "PENDING");
  closeOverlay();
  if (currentRoute().caseId) {
    notify(pending ? "已保存，新图片的预览生成后自动出现" : "已保存");
    render();
  } else {
    notify(pending ? "已上传，预览生成后自动出现" : "已上传");
    // 新卡片被当前筛选挡住时才清筛选，免得「上传成功却找不到」
    if (!visibleCases().list.includes(item)) { state.sub = "ALL"; state.mine = false; state.query = ""; state.committedQuery = ""; }
    render();
    const toolbar = $(".libraryToolbar");
    if (toolbar) window.scrollTo({ top: Math.max(0, toolbar.offsetTop - 90), behavior: "smooth" });
  }
  scheduleDerivatives(item);
}
/** 模拟数据万象持久化处理：几秒后两档预览就绪；原图超过 20 MB 的标 FAILED。列表靠轮询（每 10 秒）看到结果，demo 直接重画。 */
function scheduleDerivatives(item) {
  setTimeout(() => {
    item.assets.forEach((asset) => {
      if (asset.type === "IMAGE" && asset.deriv === "PENDING" && asset.upload === "READY") asset.deriv = asset.sizeMB > LIMITS.derivativeMB ? "FAILED" : "READY";
    });
    if (!state.overlay) { if (currentRoute().caseId) rerenderStage(); else renderLibraryPreservingScroll(); }
  }, 2600);
}
function retryFailed() {
  const overlay = state.overlay;
  const item = findCase(overlay.caseId);
  item.assets.forEach((asset) => { if (overlay.failed.includes(asset.id)) asset.failOnUpload = false; });
  uploadAssets(item, overlay.failed, () => finishUpload(item));
}
function dropFailed() {
  const overlay = state.overlay;
  const item = findCase(overlay.caseId);
  const remaining = item.assets.filter((asset) => !overlay.failed.includes(asset.id));
  if (!remaining.length && !item.text.trim()) {
    overlay.error = "去掉之后这条案例既没有素材也没有正文，请重传，或者删掉这条案例。";
    renderUpload();
    return;
  }
  item.assets = remaining;
  finishUpload(item);
}

/* ============================================================
   渲染入口与事件
   ============================================================ */
function render() {
  const route = currentRoute();
  if (!$("#siteHeader")) {
    $("#app").innerHTML = `<main class="surface"><header class="siteHeader" id="siteHeader"></header><div id="page"></div></main>`;
  }
  renderHeader();
  if (route.caseId) renderDetail(route.caseId); else renderLibrary();
}

document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  // 外观菜单：点菜单以外的地方收起
  if (state.themeOpen && !event.target.closest("[data-theme-switcher]")) { state.themeOpen = false; renderHeader(); }
  if (event.target.closest("[data-theme-pick]")) { chooseTheme(event.target.closest("[data-theme-pick]").dataset.themePick); return; }
  if (!target) return;
  const { action, id } = target.dataset;
  switch (action) {
    case "theme-toggle": state.themeOpen = !state.themeOpen; renderHeader(); if (state.themeOpen) $(".option[aria-checked='true']")?.focus(); break;
    case "go-list": event.preventDefault(); goList(); break;
    case "other-library": notify(`demo 只做公共视觉库；${target.dataset.library}沿用现有页面`); break;
    case "upload": openUpload(); break;
    case "open": event.preventDefault(); openCase(id); break;
    case "not-ready": notify("这条案例还没上传完，完成后才能查看。"); break;
    case "favorite": toggleFavorite(id); break;
    case "sub": state.sub = target.dataset.sub; renderLibraryPreservingScroll(); break;
    case "sort-fav": state.sortFav = !state.sortFav; if (state.sortFav) freezeOrder(); else state.frozen = null; renderLibraryPreservingScroll(); break;
    case "reorder": freezeOrder(); renderLibraryPreservingScroll(); break;
    case "mine": state.mine = !state.mine; renderLibraryPreservingScroll(); break;
    case "clear-filters": state.sub = "ALL"; state.mine = false; state.query = ""; state.committedQuery = ""; renderLibraryPreservingScroll(); break;
    case "resume": openResume(id); break;
    case "delete": openDelete(id); break;
    case "confirm-delete": confirmDelete(); break;
    case "edit": openEdit(id); break;
    case "stage-go": stageGo(Number(target.dataset.index)); break;
    case "stage-step": stageGo(state.stageIndex + Number(target.dataset.step)); break;
    case "play": togglePlay(); break;
    case "viewer": openViewer(Number(target.dataset.image)); break;
    case "viewer-step": viewerStep(Number(target.dataset.step)); break;
    case "original": openOriginal(id); break;
    case "close-overlay": closeOverlay(); break;
    case "picker": state.overlay.picker = !state.overlay.picker; renderUpload(); break;
    case "pick": pickFiles(target.dataset.kind); break;
    case "media-cover": mediaOp("cover", Number(target.dataset.index)); break;
    case "media-move": mediaOp("move", Number(target.dataset.index), Number(target.dataset.step)); break;
    case "media-remove": mediaOp("remove", Number(target.dataset.index)); break;
    case "meta-many": toggleMetaMany(target.dataset.key, target.dataset.value); break;
    case "fold": state.overlay.fold = !state.overlay.fold; renderUpload(); break;
    case "submit": submitDraft(); break;
    case "retry-failed": retryFailed(); break;
    case "drop-failed": dropFailed(); break;
    default: break;
  }
});

/* 遮罩：查看器和删除确认点遮罩就关（删除提交中除外）；上传对话框只有在什么都没填时才关——
   这张表单比报告上传长得多，误点一下丢光不划算（视频上传对话框本来就不响应遮罩点击）。 */
document.addEventListener("mousedown", (event) => {
  const backdrop = event.target.dataset && event.target.dataset.backdrop;
  if (!backdrop || !state.overlay) return;
  if (backdrop === "viewer") closeOverlay();
  if (backdrop === "delete" && !state.overlay.pending) closeOverlay();
  if (backdrop === "upload" && state.overlay.phase === "form" && !state.overlay.dirty) closeOverlay();
});

document.addEventListener("input", (event) => onDraftInput(event.target));
document.addEventListener("change", (event) => {
  if (event.target.matches("[data-viewer-switch]")) { state.viewer = event.target.value; render(); }
});

/* 唯一的键盘监听：按当前浮层分派，不会因为开关多次而叠加。 */
document.addEventListener("keydown", (event) => {
  const overlay = state.overlay;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
  if (state.themeOpen) {
    const options = $$(".option");
    const index = options.indexOf(document.activeElement);
    if (event.key === "Escape") { state.themeOpen = false; renderHeader(); $("[data-theme-switcher] .trigger")?.focus(); return; }
    const next = { ArrowDown: (index + 1) % options.length, ArrowUp: (index - 1 + options.length) % options.length, Home: 0, End: options.length - 1 }[event.key];
    if (next !== undefined && index >= 0) { event.preventDefault(); options[next].focus(); }
    return;
  }
  if (overlay && overlay.kind === "viewer") {
    if (event.key === "Escape") closeOverlay();
    else if (event.key === "ArrowLeft") viewerStep(-1);
    else if (event.key === "ArrowRight") viewerStep(1);
    return;
  }
  if (overlay && overlay.kind === "delete") { if (event.key === "Escape" && !overlay.pending) closeOverlay(); return; }
  if (overlay && overlay.kind === "upload") {
    if (event.key === "Escape" && overlay.phase === "form" && !overlay.dirty) closeOverlay();
    return;
  }
  // 详情页：焦点在素材条上时 ←→ 切换（roving tabindex），不抢页面其他地方的方向键
  if (!typing && event.target.classList && event.target.classList.contains("mediaThumb")) {
    if (event.key === "ArrowLeft") { event.preventDefault(); stageGo(state.stageIndex - 1, true); }
    if (event.key === "ArrowRight") { event.preventDefault(); stageGo(state.stageIndex + 1, true); }
  }
});

window.addEventListener("popstate", () => navigate(parseHash(), false));
// 跟随系统时，系统深浅一变，外观开关的图标不变（偏好还是 system），颜色由 CSS 媒体查询自己跟上，不用脚本。

render();
</script>
</body>
