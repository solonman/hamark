<!--
  客户需求复盘库 demo　2026-10-14 初版（配套 docs/26_客户需求复盘库_实施规格_V0.1.md）
  分工同 docs/22：demo 定观感与交互，docs/26 定数据、状态、接口、边界；两者冲突以 docs/26 为准，回头修 demo。

  原则：能用站里现成的，就长得和它一模一样（docs/26 10.0 复用清单）。
  - 直接照抄线上类名与配色：components/v04/V04Surface.module.css（siteHeader／siteNav、libraryHero、libraryToolbar、
    librarySearch、caseGrid、weekSection／weekHeading、caseCard 一组、detailHero、breadcrumb、detailEyebrow、detailTags、
    readingModule、readingCore、emptyState，以及录音点评那组 reviewAudio*／reviewTranscript*／reviewLine*／reviewSteps／reviewSpin）、
    components/report/library/ReportLibrary.module.css（4:3 .cover、上传对话框 uploadDialog／field／two／hint／formError／uploadFooter）、
    components/shared/LibraryToast、DeleteConfirmDialog、ThemeSwitcher，app/globals.css 的 --v04-* 深浅两套。
    这些部位在 demo 里的样式是从公共视觉 demo（docs/demos/2026-09-18）原样复制的，实现时直接复用线上组件，不要照 demo 另写一份。
  - 本域新增（只用现有 --v04-* 变量，不新增配色变量）：月份标题行上的成果状态与「进入本月」、文字封面（部门 chip、客户名、
    回合轨迹、录音标记）、回合时间线、附件格（含 PDF 格）、关联作品小卡与选择框、录音多段切换、月份页（概况、三个页签、老孙操作区、
    三步进度、草稿审阅与吸底栏、历史版本）、教学纪要、方法候选卡与维度／类别药丸、出处标记与浮层。
    三类方法候选的标记用 --v04-accent（方法）、--v04-subject（直觉）、--v04-muted（情境）。
  - 封面、附件缩略图、关联作品缩略图是深色岛（data-v04-scheme="dark"），浅色主题下仍是深色；这几处的写死颜色只出现在深色岛里。
  - 纯前端，不保存，刷新即回到初始状态；外观偏好存 localStorage（线上存 cookie hm-theme）。录音、附件、AI 生成都是模拟。

  demo 专用控件（线上没有）：
  - 右上角「身份」下拉：老孙（生成、审阅、发布）／上传者 刘梦娜（是部分案例的上传者，能编辑、删除自己的案例）／其他同事（只能看、能传点评录音）。
    线上这里是 UserMenu；老孙的判定是 isCaseReviewer。demo 里三个身份都不是系统管理员。
  - 页面顶部虚线条「月份成果状态」：只作用于 2026 年 10 月——未整理／整理中（三步进度十几秒走完，变待审阅并弹 toast）／待审阅／已发布 v1。
    整理中时另有一个「模拟这一步失败」，用来看失败态。
  - 选文件的窗口用几个按钮代替（点评录音、附件），其中有会被拒、会失败的样例。

  2026-10-19 按项目负责人意见修订：
  - 新建对话框只填 复盘月份／部门／客户／案例标题／客户服务场景；「任务与最初需求」改到案例页编辑状态里填，选填（空着时只提示，不拦截）。
  - 案例页没有「编辑／完成」模式，改成和视频工作台一样的原位编辑（线上 components/v04/V19EditableValue.tsx，类名 editable／
    editableBlock／editableEmpty／editableInput／editableTextarea）：阅读态就是正文，上传者、管理员点一下（或 Enter／Space）变输入框，
    失焦提交（单行框回车也提交，Esc 放弃），旁边短暂显示「已保存」；空字段显示灰色「点击填写…」。回合的 ↑↓ 删除、「＋ 添加一回合」、
    附件的「＋ 附件」和 ×、「关联作品」对有权限的人常驻，样式克制。没有权限的人纯阅读，空字段不渲染。
    基本信息（月份、部门、客户、标题、场景）用「编辑基本信息」对话框改，外壳同新建对话框。
  - 点评录音：hero 不再放上传按钮；没有录音时录音模块收成一行窄条（说明 + 「上传」），有录音（含上传中、转写中、失败）时是完整模块。
  - 「在本月纪要里」只在本案例被包含在已发布版本里时显示（发布那一刻冻结的案例清单），发布后才新建的案例不显示。
  - 「任务与最初需求」模块加附件（客户需求的原始凭证）；附件类型与回合统一：图片、视频、音频、文档。
    PDF 在线打开，Word／Excel／PPT 可以传、点开是下载。
  - 附件里的音频（客户语音、通话录音）传完自动转写：格上显示「转写中」→「时长 · 文字稿」，失败显示「转写失败 · 重试」；
    点开是播放条 + 文字稿（全员可见）。月份页生成前提加一行客户录音转写状态；纪要「经过」「关键争议」可以引用客户录音
    （出处标记「客户录音 · 00:42」），方法候选仍只引用点评录音。
  - 案例上的录音一律叫「点评录音」；月份上的「整场总结」保留原名。
-->
<script>
  // 首屏前按偏好设好 data-theme，免得先闪一下深色（线上是根布局按 cookie 直接渲染）。
  try {
    const saved = localStorage.getItem("hm-theme");
    if (saved === "light" || saved === "dark" || saved === "system") document.documentElement.dataset.theme = saved;
  } catch (error) { /* 隐私模式读不到就用默认深色 */ }
</script>

.weekHeading h3 { margin: 0; font-size: 16px; letter-spacing: -.03em; }
.weekHeading span { color: var(--v04-muted); font-size: 11px; }
/* 本域新增：月份标题行右侧的成果状态 + 进入本月。 */
.monthHeadRight { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: auto; }
.weekHeading .monthStatus, .monthStatus { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--v04-line); border-radius: 999px; padding: 3px 9px; color: var(--v04-muted); font-size: 10px; font-weight: 800; white-space: nowrap; }
.monthStatus i { width: 6px; height: 6px; flex: none; border-radius: 50%; background: currentColor; }
.monthStatus[data-tone="running"] { border-color: rgb(var(--v04-subject-rgb) / .5); color: var(--v04-subject); }
.monthStatus[data-tone="published"] { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }
.monthStatus[data-tone="updated"] { border-color: rgb(var(--v04-warn-rgb) / .5); color: var(--v04-warn); }
.monthEnter { color: var(--v04-ink); font-size: 11px; font-weight: 900; text-decoration: none; white-space: nowrap; }
.monthEnter:hover { color: var(--v04-accent); }

/* ---------------- 封面（ReportLibrary .cover：4:3、深色岛） + 本域文字封面 ---------------- */
.cover { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--v04-line); background: #0b0c0a; padding: 0; text-align: left; color: #fff; text-decoration: none; }
.cover::after { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 46%, rgba(0,0,0,.66)); content: ""; pointer-events: none; }
.coverArt { position: absolute; inset: 0; }
.coverFormat { position: absolute; top: 12px; left: 12px; z-index: 2; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 4px 9px; font-size: 9px; letter-spacing: .06em; background: rgba(0,0,0,.4); color: #e6e7df; }
/* 文字封面（10.2）：没有图片，只有部门、客户名、回合轨迹、录音标记。 */
.coverRec { position: absolute; top: 12px; right: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; background: rgba(0,0,0,.5); color: #e6e7df; white-space: nowrap; }
.coverRec svg { width: 11px; height: 11px; flex: none; }
.coverRec[data-rec="ready"] { color: #dfff4f; }
.coverRec[data-rec="busy"] { color: #c7aa72; }
.coverRec[data-rec="none"] { color: #a3a69b; }
.coverRec[data-rec="failed"] { color: #ff8f7d; }
.coverRec .reviewSpin { width: 10px; height: 10px; border-width: 1.5px; }
.coverClient { position: absolute; left: 22px; right: 22px; top: 50%; z-index: 2; margin: 0; transform: translateY(-62%); color: #f0f1ea; font-size: clamp(28px, 4.2vw, 54px); font-weight: 900; line-height: 1.02; letter-spacing: -.06em; overflow-wrap: anywhere; }
.coverClient small { display: block; margin-bottom: 8px; color: #a3a69b; font-size: 10px; font-weight: 800; letter-spacing: .16em; }
.coverTrack { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 3; display: flex; align-items: flex-start; margin: 0; padding: 0; list-style: none; }
.coverTrack li { position: relative; display: grid; flex: 1 1 0; min-width: 0; justify-items: center; gap: 7px; }
.coverTrack li::before { position: absolute; top: 4px; left: -50%; width: 100%; height: 1px; background: rgba(255,255,255,.28); content: ""; }
.coverTrack li:first-child::before { display: none; }
.coverTrack i { position: relative; z-index: 1; width: 9px; height: 9px; border-radius: 50%; background: #8b8e83; }
.coverTrack li[data-kind="end"] i { background: #e6e7df; }
.coverTrack li[data-fb="1"] i { background: #10110f; box-shadow: 0 0 0 2px #dfff4f; }
.coverTrack li[data-empty="1"] i { background: transparent; box-shadow: inset 0 0 0 1px #8b8e83; }
.coverTrack span { overflow: hidden; max-width: 100%; color: #b9bbb2; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- 卡片正文（V04Surface .caseBody 一组） ---------------- */
.caseBody { padding: 14px 2px 0; }
.caseQuickActions { position: relative; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.caseEnterPill { display: inline-flex; align-items: center; min-height: 38px; border: 1px solid rgb(var(--v04-fg-rgb) / .22); border-radius: 999px; background: rgb(var(--v04-bg-rgb) / .88); color: var(--v04-ink); padding: 0 16px; font-size: 11px; font-weight: 900; text-decoration: none; backdrop-filter: blur(10px); transition: border-color .12s, color .12s, background .12s; }
.caseEnterPill:hover { border-color: rgb(var(--v04-accent-rgb) / .55); background: rgb(var(--v04-accent-rgb) / .1); color: var(--v04-accent); }
.retryButton { border: 1px solid var(--v04-line); border-radius: 999px; background: none; color: var(--v04-muted); padding: 6px 11px; font-size: 10.5px; }
.retryButton:hover:not(:disabled) { border-color: rgb(var(--v04-accent-rgb) / .4); color: var(--v04-accent); }
.caseNumber { margin: 0 0 7px; color: var(--v04-subject); font-size: 9px; font-weight: 900; letter-spacing: .15em; }
.caseTitleStatus h2 { display: grid; gap: 3px; margin: 0; min-width: 0; }
.caseTitleStatus h2 small { color: var(--v04-muted); font-size: 10px; font-weight: 700; }
.caseTitleStatus h2 span { font-size: clamp(21px, 2.4vw, 30px); line-height: 1.05; letter-spacing: -.055em; overflow-wrap: anywhere; }
.caseSummary { display: -webkit-box; overflow: hidden; margin: 10px 0 0; color: var(--v04-muted); font-size: 13px; line-height: 1.55; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.caseInfoBand { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--v04-line); color: var(--v04-muted); font-size: 9px; }
.caseInfoBand > span { border-radius: 999px; padding: 5px 8px; }
.caseInfoBand > span:not(.caseCategoryTag) { background: var(--v04-raised); }
.caseCategoryTag { border: 1px solid var(--v04-line); }

.emptyState { width: min(900px, calc(100% - 48px)); margin: 60px auto; padding: 44px; border: 1px solid var(--v04-line); border-radius: 18px; background: var(--v04-panel); text-align: center; }
.emptyState > span { color: var(--v04-muted); font-size: 26px; }
.emptyState h2 { margin: 0 0 10px; }
.emptyState p { color: var(--v04-muted); }
.emptyState button { display: inline-flex; margin-top: 16px; border: 0; border-radius: 999px; background: var(--v04-accent-fill); color: var(--v04-on-accent); padding: 12px 18px; font-weight: 800; }

/* ---------------- 只读详情（V04Surface .detailHero / .readingModule 一组） ---------------- */
.detailHero { width: min(1160px, calc(100% - 48px)); margin: 0 auto; padding: clamp(38px, 6vw, 82px) 0 30px; }
.breadcrumb { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 44px; color: var(--v04-muted); font-size: 10px; }
.breadcrumb a { color: inherit; text-decoration: none; }
.breadcrumb a:hover { color: var(--v04-accent); }
.breadcrumb b { color: var(--v04-ink); }
.detailEyebrow { margin: 0 0 12px; color: var(--v04-subject); font-size: 10px; font-weight: 900; letter-spacing: .14em; }
.detailHero h1 { max-width: 1020px; margin: 0; font-size: clamp(34px, 5vw, 64px); line-height: 1.04; letter-spacing: -.055em; overflow-wrap: anywhere; }
.detailSummary { max-width: 720px; margin: 22px 0 0; color: var(--v04-muted); font-size: 15px; line-height: 1.8; }
.detailTags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
.detailTags span { border: 1px solid var(--v04-line); border-radius: 999px; padding: 6px 10px; color: var(--v04-muted); font-size: 9px; }
.detailActions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 24px; }
.toolButton { border: 1px solid var(--v04-line); border-radius: 999px; background: transparent; color: var(--v04-ink); padding: 8px 11px; font-size: 10px; }
.toolButton:hover { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }
.toolButtonDanger:hover { border-color: rgb(var(--v04-danger-2-rgb) / .5); color: var(--v04-danger-2); }
.toolButtonAccent { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }

.readingBody { width: min(1160px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 100px; }
.readingModule { margin: 0 0 22px; border: 1px solid var(--v04-line); border-radius: 18px; background: var(--v04-panel); scroll-margin-top: 84px; }
.readingModule > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--v04-line); }
.readingModule > header small { display: block; margin-bottom: 4px; color: var(--v04-muted); font-size: 9px; font-weight: 900; letter-spacing: .17em; }
.readingModule > header h2 { margin: 0; color: var(--v04-subject); font-size: 18px; }
.prose { max-width: 72ch; margin: 0; padding: 20px 22px 24px; color: var(--v04-ink-soft); font-size: 14.5px; line-height: 1.95; white-space: pre-wrap; overflow-wrap: anywhere; }
.readingCore { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.readingCore > div { min-width: 0; padding: 18px 22px; border-bottom: 1px solid var(--v04-line); }
.readingCore > div:nth-child(even) { border-left: 1px solid var(--v04-line); }
.readingCore small { display: block; margin-bottom: 6px; color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.readingCore p { margin: 0; color: var(--v04-ink-soft); line-height: 1.65; overflow-wrap: anywhere; white-space: pre-wrap; }
.readingNote { margin: 0; padding: 14px 22px 18px; color: var(--v04-muted); font-size: 11px; line-height: 1.7; }

/* ---------------- 原地编辑（工作台失焦自动保存 + 「已保存」写法） ---------------- */
.editStrip { position: sticky; top: 70px; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px clamp(18px, 3vw, 48px); border-bottom: 1px solid rgb(var(--v04-accent-rgb) / .35); background: rgb(var(--v04-panel-rgb) / .96); backdrop-filter: blur(12px); font-size: 12px; }
.editStrip b { color: var(--v04-accent); }
.editStrip span { color: var(--v04-muted); }
.editStrip .grow { flex: 1; }
.editGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 1020px; margin-bottom: 16px; }
.editTitle { width: 100%; max-width: 1020px; border: 1px solid rgb(var(--v04-accent-rgb) / .35); border-radius: 12px; background: var(--v04-sunken); color: var(--v04-ink); padding: 8px 12px; font-size: clamp(24px, 3.4vw, 40px); font-weight: 800; line-height: 1.2; letter-spacing: -.04em; }
.eArea { display: block; width: 100%; min-height: 84px; border: 1px solid var(--v04-line); border-radius: 10px; background: var(--v04-sunken); color: var(--v04-ink); padding: 8px 11px; font-size: 13px; line-height: 1.7; resize: vertical; }
.eArea:focus, .eInput:focus, .editTitle:focus { outline: none; border-color: rgb(var(--v04-accent-rgb) / .6); }
.eInput { width: 100%; min-width: 0; height: 32px; border: 1px solid var(--v04-line); border-radius: 999px; background: var(--v04-sunken); color: var(--v04-ink); padding: 0 12px; font-size: 12px; }
.eTip { display: block; margin: 4px 0 0; color: var(--v04-muted); font-size: 10.5px; font-weight: 400; line-height: 1.5; }
.eTip b { color: var(--v04-subject); }
.proseEdit { padding: 16px 22px 20px; }

/* ---------------- 回合时间线（本域新增） ---------------- */
.timeline { position: relative; display: grid; gap: 18px; margin: 0; padding: 20px 22px 22px 46px; list-style: none; }
.timeline::before { position: absolute; top: 30px; bottom: 30px; left: 27px; width: 1px; background: rgb(var(--v04-fg-rgb) / .2); content: ""; }
.roundCard { position: relative; min-width: 0; border: 1px solid var(--v04-line); border-radius: 14px; background: var(--v04-panel-alt); scroll-margin-top: 90px; }
.roundCard::before { position: absolute; top: 18px; left: -24px; width: 11px; height: 11px; border-radius: 50%; background: var(--v04-muted); box-shadow: 0 0 0 4px var(--v04-panel); content: ""; }
.roundCard[data-fb="1"]::before { background: var(--v04-panel); box-shadow: 0 0 0 4px var(--v04-panel), inset 0 0 0 2px var(--v04-accent); }
.roundCard.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px rgb(var(--v04-accent-rgb) / .6); } 100% { box-shadow: 0 0 0 3px rgb(var(--v04-accent-rgb) / 0); } }
.roundHead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--v04-line); }
.roundHead h3 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
.roundHead h3 small { margin-left: 8px; color: var(--v04-muted); font-size: 11px; font-weight: 400; letter-spacing: 0; }
.roundNo { color: var(--v04-subject); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; }
.roundTools { display: inline-flex; gap: 6px; margin-left: auto; }
.roundTools button { display: grid; min-width: 24px; height: 24px; place-items: center; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--v04-muted); padding: 0 7px; font-size: 10.5px; }
.roundTools button:hover:not(:disabled) { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }
.roundTools button.danger:hover:not(:disabled) { border-color: rgb(var(--v04-danger-2-rgb) / .5); color: var(--v04-danger-2); }
.roundTools button:disabled { opacity: .3; cursor: default; }
.roundBody { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.roundBody > div { min-width: 0; padding: 14px 16px; }
.roundBody > div + div { border-left: 1px solid var(--v04-line); }
.roundBody small { display: block; margin-bottom: 6px; color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.roundBody p { margin: 0; color: var(--v04-ink-soft); font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
.roundBody .feedback p { padding-left: 10px; border-left: 2px solid rgb(var(--v04-subject-rgb) / .55); color: var(--v04-ink); }
.roundEditHead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; flex: 1 1 320px; }
.roundExtras { display: grid; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--v04-line); }
.roundExtras > small { color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.roundEmpty { margin: 0; padding: 14px 16px; color: var(--v04-muted); font-size: 12px; }
.addRound { display: block; width: 100%; border: 1px dashed var(--v04-line); border-radius: 12px; background: transparent; color: var(--v04-muted); padding: 10px; font-size: 11.5px; font-weight: 700; }
.addRound:hover { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); background: rgb(var(--v04-accent-rgb) / .05); }

/* 附件格：素材格（公共视觉对话框 .mediaTile）同一套，加 PDF 格。缩略图是深色岛。 */
.assetGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.assetTile { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--v04-line); border-radius: 10px; background: #0b0c0a; }
.assetTile > button.open { position: absolute; inset: 0; border: 0; background: transparent; padding: 0; }
.assetTile .play { position: absolute; left: 50%; top: 50%; z-index: 2; display: grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; background: var(--v04-accent-fill); color: var(--v04-on-accent); font-size: 10px; transform: translate(-50%, -50%); pointer-events: none; }
.assetTile .kind { position: absolute; left: 6px; bottom: 6px; z-index: 2; max-width: calc(100% - 12px); overflow: hidden; border-radius: 4px; padding: 2px 5px; background: rgba(0,0,0,.62); color: #fff; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
.assetTile.pdf { display: grid; place-items: center; background: #1a1b17; }
.pdfIcon { display: grid; justify-items: center; gap: 6px; padding: 8px; color: #e6e7df; text-align: center; pointer-events: none; }
.pdfIcon svg { width: 26px; height: 30px; }
.pdfIcon span { display: -webkit-box; overflow: hidden; max-width: 100%; color: #b9bbb2; font-size: 9.5px; line-height: 1.35; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.assetTile .x { position: absolute; top: 5px; right: 5px; z-index: 3; display: grid; width: 20px; height: 20px; opacity: .7; place-items: center; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; background: rgba(9,10,8,.82); color: #f0f1ea; font-size: 11px; padding: 0; }
.assetTile .x:hover { opacity: 1;  border-color: rgba(223,255,79,.6); color: #dfff4f; }
.assetTile .tileState { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; gap: 6px; padding: 8px; background: rgba(8,9,7,.72); color: #e6e7df; font-size: 10px; text-align: center; }
.assetTile .tileState.bad { color: #ffb3a6; }
.assetTile .tileState i { display: block; width: 70px; height: 4px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.18); }
.assetTile .tileState i b { display: block; height: 100%; background: #dfff4f; }
.assetTile .tileState button { justify-self: center; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; background: transparent; color: #e6e7df; padding: 3px 9px; font-size: 10px; }
.assetBlock { display: grid; gap: 12px; min-width: 0; }
.assetLabel { color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.assetLabel i { color: var(--v04-muted); font-style: normal; font-weight: 400; }
.audioTile .audioIcon { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; background: rgba(223,255,79,.14); color: #dfff4f; }
.audioTile .audioIcon svg { width: 15px; height: 15px; }
.audioTile .audioDur { color: #dfff4f; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; }
.audioTile.on { outline: 2px solid #dfff4f; outline-offset: -2px; }
.assetAudioPanel { display: grid; gap: 10px; min-width: 0; }
.audioTile .audioDur .reviewSpin { width: 9px; height: 9px; border-width: 1.5px; margin-right: 4px; vertical-align: -1px; }
.assetTile .tileRetry { position: relative; z-index: 3; border: 1px solid rgba(255,143,125,.6); border-radius: 999px; background: rgba(9,10,8,.8); color: #ff8f7d; padding: 2px 8px; font-size: 9.5px; pointer-events: auto; }
.audioTile .pdfIcon { pointer-events: none; }
.audioTile .pdfIcon .tileRetry { pointer-events: auto; }
/* 原位编辑：V04Surface .editable 一组（V19EditableValue），原样照抄。 */
.editable { display: inline-block; max-width: 100%; padding: 0 2px; margin: 0 -2px; border-bottom: 1px dashed transparent; border-radius: 4px; color: var(--v04-ink-soft); line-height: 1.65; cursor: text; transition: background .12s; overflow-wrap: anywhere; }
.editable:hover { border-bottom-color: rgb(var(--v04-accent-rgb) / .4); background: rgb(var(--v04-accent-rgb) / .08); }
.editableBlock { display: block; white-space: pre-wrap; }
.editableEmpty { color: var(--v04-muted); }
.editableInput { width: 100%; min-width: 5ch; max-width: 100%; border: 1px solid rgb(var(--v04-accent-rgb) / .4); border-radius: 7px; background: var(--v04-sunken); color: var(--v04-ink); padding: 6px 8px; font: inherit; }
.editableInput:focus { outline: none; border-color: rgb(var(--v04-accent-rgb) / .7); }
.editableTextarea { display: block; min-height: 64px; max-height: 46vh; line-height: 1.55; resize: vertical; overflow-y: auto; }
.editField { display: inline; }
.editField.block { display: block; }
.roundHead h3 .editField .editableInput { width: auto; min-width: 12ch; font-size: 14px; }
.roundHead h3 small .editableInput { min-width: 10ch; font-size: 11px; }
.savedFlash { display: inline-block; margin-left: 8px; color: var(--v04-accent); font-size: 10px; font-weight: 800; letter-spacing: .04em; transition: opacity .5s; }
.savedFlash.gone { opacity: 0; }
.addRoundRow { padding: 0 22px 22px 46px; }
.recStrip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 22px; padding: 12px 18px; border: 1px solid var(--v04-line); border-radius: 14px; background: var(--v04-panel); color: var(--v04-muted); font-size: 12px; scroll-margin-top: 84px; }
.recStrip > span { flex: 1 1 260px; min-width: 0; }
.recStrip b { color: var(--v04-subject); }
.briefEmpty { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 22px; font-size: 12.5px; }
.addTile { display: grid; place-items: center; aspect-ratio: 4 / 3; border: 1px dashed var(--v04-line); border-radius: 10px; background: transparent; color: var(--v04-muted); font-size: 11px; font-weight: 700; }
.addTile:hover { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); background: rgb(var(--v04-accent-rgb) / .05); }
.demoPicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border: 1px dashed rgb(var(--v04-subject-rgb) / .45); border-radius: 12px; font-size: 10.5px; color: var(--v04-muted); }
.demoPicker em { flex-basis: 100%; font-style: normal; color: var(--v04-subject); font-size: 10px; font-weight: 800; letter-spacing: .06em; }
.check { border: 1px solid var(--v04-line); border-radius: 999px; background: none; color: var(--v04-muted); padding: 5px 10px; font-size: 11px; }

.check[aria-pressed="true"] { border-color: rgb(var(--v04-accent-rgb) / .55); background: rgb(var(--v04-accent-rgb) / .12); color: var(--v04-accent); }

/* 关联作品小卡（缩略图、库名、标题；原作品被删时显示「原作品已删除」）。 */
.linkCards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.linkCard { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 10px; min-width: 0; border: 1px solid var(--v04-line); border-radius: 10px; background: var(--v04-panel); padding: 6px 30px 6px 6px; color: var(--v04-ink); text-align: left; }
button.linkCard:hover { border-color: rgb(var(--v04-accent-rgb) / .45); }
.linkThumb { aspect-ratio: 4 / 3; border-radius: 6px; background: #0b0c0a; }
.linkCard small { display: block; color: var(--v04-subject); font-size: 9px; font-weight: 800; letter-spacing: .06em; }
.linkCard b { display: block; overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.linkCard.gone b { color: var(--v04-muted); text-decoration: line-through; }
.linkCard.gone em { color: var(--v04-warn); font-size: 10px; font-style: normal; }
.linkCard .x { position: absolute; top: 50%; right: 6px; display: grid; width: 20px; height: 20px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--v04-muted); padding: 0; transform: translateY(-50%); }
.linkCard .x:hover { color: var(--v04-danger-2); }
.linkX { position: absolute; top: 50%; right: 6px; display: grid; width: 22px; height: 22px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--v04-muted); padding: 0; font-size: 13px; transform: translateY(-50%); }
.linkX:hover { color: var(--v04-danger-2); }
.linkAdd { justify-self: start; border: 1px solid var(--v04-line); border-radius: 999px; background: none; color: var(--v04-muted); padding: 4px 11px; font-size: 10.5px; font-weight: 700; }
.linkAdd:hover { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }

/* ---------------- 录音（V19AudioReviewAudioBar / V19AudioReviewTranscript / V19AudioReviewEntry 同一套） ---------------- */
.recBody { display: grid; gap: 12px; padding: 16px 22px 18px; }
.recEmpty { display: grid; justify-items: center; gap: 8px; width: 100%; border: 1.5px dashed rgb(var(--v04-accent-rgb) / .4); border-radius: 14px; background: var(--v04-sunken); padding: 26px 16px; color: var(--v04-muted); font-size: 12px; text-align: center; }
.recEmpty svg { width: 24px; height: 24px; color: var(--v04-accent); }
.recEmpty b { color: var(--v04-ink); font-size: 13px; }
.recEmpty:hover { border-color: rgb(var(--v04-accent-rgb) / .7); }
.recParts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.recParts .grow { flex: 1; }
.recMeta { color: var(--v04-muted); font-size: 11px; overflow-wrap: anywhere; }
.reviewSpin { display: inline-block; width: 13px; height: 13px; flex: none; border: 2px solid rgb(var(--v04-accent-rgb) / .25); border-top-color: var(--v04-accent); border-radius: 50%; animation: reviewSpin .8s linear infinite; }
@keyframes reviewSpin { to { transform: rotate(360deg); } }
/* 处理中、失败胶囊（V19AudioReviewEntry 的 chip 形态） */
.procChip { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; border: 1px solid var(--v04-line); border-radius: 999px; padding: 0 13px; color: var(--v04-ink-dim); font-size: 12px; white-space: nowrap; }
.procChip.failed { border-color: rgb(var(--v04-warn-rgb) / .55); color: var(--v04-warn); }
.procChip b { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 700; }
.procRow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border: 1px solid var(--v04-line); border-radius: 12px; background: var(--v04-panel-alt); }
.procRow p { flex: 1 1 220px; margin: 0; color: var(--v04-muted); font-size: 11.5px; line-height: 1.6; overflow-wrap: anywhere; }
.procRail { flex: 1 1 160px; height: 4px; overflow: hidden; border-radius: 2px; background: var(--v04-raised-2); }
.procRail > i { display: block; height: 100%; border-radius: 2px; background: var(--v04-accent); transition: width .2s; }
:is(.surface, #overlay, #popLayer) .reviewGhostButton { flex: none; border: 1px solid var(--v04-line); border-radius: 999px; background: transparent; color: var(--v04-ink); padding: 6px 13px; font-size: 11.5px; line-height: 1.5; white-space: nowrap; cursor: pointer; }
:is(.surface, #overlay, #popLayer) .reviewGhostButton:hover:not(:disabled) { border-color: rgb(var(--v04-accent-rgb) / .5); color: var(--v04-accent); }
:is(.surface, #overlay, #popLayer) .reviewDangerButton:hover:not(:disabled) { border-color: rgb(var(--v04-danger-rgb) / .6); color: var(--v04-danger); }
:is(.surface, #overlay, #popLayer) .reviewPrimaryButton { flex: none; border: 0; border-radius: 999px; background: var(--v04-accent-fill); color: var(--v04-on-accent); padding: 7px 16px; font-size: 12px; font-weight: 800; line-height: 1.5; white-space: nowrap; cursor: pointer; }
:is(.surface, #overlay, #popLayer) .reviewPrimaryButton:hover:not(:disabled) { filter: brightness(1.05); }
:is(.surface, #overlay, #popLayer) .reviewGhostButton:disabled, :is(.surface, #overlay, #popLayer) .reviewPrimaryButton:disabled { cursor: not-allowed; opacity: .45; }
.reviewAudio { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 8px 12px; border: 1px solid var(--v04-line); border-radius: 12px; background: var(--v04-panel-alt); }
:is(.surface, #overlay, #popLayer) .reviewAudioPlay { display: grid; width: 30px; height: 30px; flex: none; place-items: center; border: 0; border-radius: 50%; background: var(--v04-accent-fill); color: var(--v04-on-accent); padding: 0; cursor: pointer; }
:is(.surface, #overlay, #popLayer) .reviewAudioPlay svg { width: 12px; height: 12px; }
.reviewAudioName { overflow: hidden; min-width: 0; max-width: 200px; color: var(--v04-ink-dim); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.reviewAudioTrack { position: relative; display: flex; flex: 1; min-width: 60px; height: 18px; align-items: center; cursor: pointer; touch-action: none; }
.reviewAudioRail { position: relative; width: 100%; height: 4px; border-radius: 2px; background: var(--v04-raised-2); pointer-events: none; }
.reviewAudioFill { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--v04-accent); }
.reviewAudioClock { flex: none; color: var(--v04-muted); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-variant-numeric: tabular-nums; }
.reviewTranscript { border: 1px solid var(--v04-line); border-radius: 12px; background: var(--v04-panel-alt); }
.reviewTranscript > summary { padding: 9px 14px; color: var(--v04-ink-dim); font-size: 12px; cursor: pointer; }
.reviewTranscriptLines { max-height: 360px; overflow: auto; padding: 0 14px 12px; overscroll-behavior: contain; }
.reviewLine { display: grid; grid-template-columns: 44px 64px minmax(0, 1fr); gap: 8px; padding: 5px 6px; border-radius: 7px; color: var(--v04-ink-soft); font-size: 12.5px; line-height: 1.6; transition: background .2s; }
.reviewLineWho { overflow: hidden; color: var(--v04-muted); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
.reviewLineReviewer .reviewLineWho { color: var(--v04-subject); font-weight: 800; }
.reviewLineText { min-width: 0; overflow-wrap: anywhere; }
.reviewLinePlaying { background: rgb(var(--v04-accent-rgb) / .1); }
:is(.surface, #overlay, #popLayer) .reviewTime { border: 0; background: none; padding: 0; color: var(--v04-accent); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; line-height: 1.6; text-align: left; cursor: pointer; }
:is(.surface, #overlay, #popLayer) .reviewTime:hover { text-decoration: underline; }
.recNote { margin: 0; color: var(--v04-muted); font-size: 11px; line-height: 1.7; }
.partDivider { margin: 12px 0 4px; padding: 0 6px; color: var(--v04-subject); font-size: 10px; font-weight: 800; letter-spacing: .06em; }
.reviewTranscriptLines > .partDivider:first-child { margin-top: 2px; }
.inMinutes .minGrid { padding-top: 14px; }
.citeList { display: grid; gap: 8px; margin: 0; padding: 0 22px 18px; list-style: none; }
.citeList li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border: 1px solid var(--v04-line); border-radius: 12px; background: var(--v04-panel-alt); font-size: 13px; }
.citeList li b { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.moduleFoot { display: flex; justify-content: flex-end; padding: 0 22px 18px; }
.moduleFoot a { color: var(--v04-accent); font-size: 12px; font-weight: 800; text-decoration: none; }
.moduleFoot a:hover { text-decoration: underline; }

/* ---------------- 月份页（本域新增） ---------------- */
.monthHero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); align-items: start; gap: 28px; }
.monthHero > div { min-width: 0; }
.monthHero.solo { grid-template-columns: minmax(0, 1fr); }
.sunPanel { display: grid; gap: 12px; margin-top: 54px; padding: 16px 18px; border: 1px solid rgb(var(--v04-subject-rgb) / .45); border-radius: 16px; background: var(--v04-panel); font-size: 12px; }
.sunPanel > small { color: var(--v04-subject); font-size: 9px; font-weight: 900; letter-spacing: .14em; }
.sunPanel h3 { margin: 0; font-size: 14px; }
.sunPanel p { margin: 0; color: var(--v04-muted); font-size: 11.5px; line-height: 1.65; overflow-wrap: anywhere; }
.sunPanel .warnLine { color: var(--v04-warn); }
.sunActs { display: flex; flex-wrap: wrap; gap: 8px; }
.preList { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.preList li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; color: var(--v04-ink-dim); font-size: 11.5px; line-height: 1.55; }
.preList li i { display: grid; width: 16px; height: 16px; place-items: center; border-radius: 50%; font-size: 9px; font-style: normal; font-weight: 900; }
.preList li[data-ok="yes"] i { background: rgb(var(--v04-accent-rgb) / .18); color: var(--v04-accent); }
.preList li[data-ok="no"] i { background: rgb(var(--v04-danger-rgb) / .16); color: var(--v04-danger); }
.preList li[data-ok="note"] i { background: rgb(var(--v04-subject-rgb) / .18); color: var(--v04-subject); }
.reviewSteps { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.reviewSteps li { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--v04-muted); }
.reviewSteps li > i { display: grid; width: 16px; height: 16px; flex: none; place-items: center; border: 1px solid var(--v04-line); border-radius: 50%; font-size: 9px; font-style: normal; line-height: 1; }
.reviewSteps small { overflow: hidden; min-width: 0; margin-left: auto; color: var(--v04-muted); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
.reviewSteps .reviewStepDone { color: var(--v04-ink-soft); }
.reviewSteps .reviewStepDone > i { border-color: transparent; background: rgb(var(--v04-accent-rgb) / .18); color: var(--v04-accent); }
.reviewSteps .reviewStepDoing { color: var(--v04-ink); font-weight: 700; }
.reviewSteps .reviewStepDoing > i { border: 2px solid rgb(var(--v04-accent-rgb) / .25); border-top-color: var(--v04-accent); animation: reviewSpin .8s linear infinite; }
.reviewSteps .reviewStepFail { color: var(--v04-warn); font-weight: 700; }
.reviewSteps .reviewStepFail > i { border-color: rgb(var(--v04-warn-rgb) / .6); color: var(--v04-warn); }
.textLink { border: 0; background: none; padding: 0; color: var(--v04-subject); font-size: 10.5px; text-decoration: underline; text-underline-offset: 3px; }
.historySelect { appearance: none; border: 1px solid var(--v04-line); border-radius: 999px; background: var(--v04-sunken) var(--v04-chevron) no-repeat right 9px center / 9px 5px; color: var(--v04-ink); padding: 4px 26px 4px 10px; font-size: 11px; }

.monthTabs { display: flex; gap: 22px; width: min(1160px, calc(100% - 48px)); margin: 0 auto 22px; overflow-x: auto; border-bottom: 1px solid var(--v04-line); scrollbar-width: none; }
.monthTabs::-webkit-scrollbar { display: none; }
.monthTabs button { display: inline-flex; flex: none; align-items: center; gap: 7px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--v04-muted); padding: 12px 0 11px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.monthTabs button:hover { color: var(--v04-ink); }
.monthTabs button[aria-selected="true"] { border-bottom-color: var(--v04-accent); color: var(--v04-ink); }
.draftBadge { border: 1px solid rgb(var(--v04-subject-rgb) / .55); border-radius: 999px; padding: 1px 7px; color: var(--v04-subject); font-size: 9.5px; font-weight: 800; }
.tabHead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 18px; color: var(--v04-muted); font-size: 11.5px; }
.tabHead .grow { flex: 1; }
.draftNote { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 18px; padding: 10px 16px; border: 1px solid rgb(var(--v04-subject-rgb) / .45); border-radius: 12px; background: var(--v04-panel); font-size: 12.5px; }
.draftNote b { color: var(--v04-subject); }
.draftNote span { flex: 1 1 260px; color: var(--v04-ink-dim); }
.histNote { margin: 0 0 18px; padding: 10px 16px; border: 1px solid var(--v04-line); border-radius: 12px; background: var(--v04-panel-alt); color: var(--v04-muted); font-size: 12px; }

/* 案例清单：表格式，手机收成卡片。 */
.caseRows { display: grid; }
.caseRow { display: grid; grid-template-columns: 54px 110px 150px minmax(0, 1fr) 74px 150px; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--v04-line); background: transparent; padding: 13px 22px; color: var(--v04-ink); font-size: 12.5px; text-align: left; }
button.caseRow:hover { background: rgb(var(--v04-accent-rgb) / .05); }
.caseRow > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caseRow .t { font-weight: 800; }
.caseRow .n { color: var(--v04-subject); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
.caseRow .m { color: var(--v04-muted); }
.caseRowHead { color: var(--v04-muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; padding-top: 10px; padding-bottom: 10px; }
.recState { display: inline-flex; align-items: center; gap: 6px; }
.recState[data-rec="ready"] { color: var(--v04-accent); }
.recState[data-rec="busy"] { color: var(--v04-subject); }
.recState[data-rec="none"] { color: var(--v04-muted); }
.recState[data-rec="failed"] { color: var(--v04-warn); }

/* 教学纪要与方法候选 */
.minCase { border-top: 1px solid var(--v04-line); }
.minCase:first-of-type { border-top: 0; }
.minCaseHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 16px 22px 4px; }
.minCaseHead b { color: var(--v04-subject); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
.minCaseHead a { color: var(--v04-ink); font-size: 15px; font-weight: 800; text-decoration: none; }
.minCaseHead a:hover { color: var(--v04-accent); }
.minCaseHead span { color: var(--v04-muted); font-size: 11px; }
.minGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 26px; padding: 6px 22px 18px; }
.minGrid > div { min-width: 0; padding: 10px 0; }
.minGrid > div.wide { grid-column: 1 / -1; }
.minGrid small, .secLabel { display: block; margin-bottom: 6px; color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.minSkip { margin: 0; padding: 4px 22px 18px; color: var(--v04-muted); font-size: 12px; }
.itemList { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.secBody { padding: 16px 22px 20px; }
.draftItem { position: relative; padding: 6px 8px; border-radius: 8px; color: var(--v04-ink-soft); font-size: 13.5px; line-height: 1.75; overflow-wrap: anywhere; }
.itemList > .draftItem { padding-left: 22px; }
.itemList > .draftItem::before { position: absolute; top: 15px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--v04-subject); content: ""; }
.isDraft .draftItem:hover { background: rgb(var(--v04-accent-rgb) / .05); }
.itemText { white-space: pre-wrap; }
.itemActs { display: inline-flex; gap: 4px; margin-left: 6px; opacity: 0; transition: opacity .12s; vertical-align: 1px; }
.draftItem > .itemActs { position: absolute; top: -10px; right: 6px; z-index: 2; margin: 0; }
.draftItem:hover .itemActs, .draftItem:focus-within .itemActs { opacity: 1; }
@media (hover: none) { .itemActs { opacity: 1; } }
.itemActs button { border: 1px solid var(--v04-line); border-radius: 999px; background: var(--v04-panel); color: var(--v04-ink); padding: 0 8px; font-size: 10px; line-height: 1.8; }
.itemActs button:hover { border-color: rgb(var(--v04-accent-rgb) / .45); color: var(--v04-accent); }
.itemActs button.danger:hover { border-color: rgb(var(--v04-danger-2-rgb) / .5); color: var(--v04-danger-2); }
.manualTag, .editedTag { display: inline-flex; margin-left: 6px; border-radius: 999px; padding: 0 7px; font-size: 9.5px; font-weight: 800; line-height: 1.8; vertical-align: 1px; white-space: nowrap; }
.manualTag { border: 1px solid rgb(var(--v04-subject-rgb) / .55); color: var(--v04-subject); }
.editedTag { background: var(--v04-raised-2); color: var(--v04-ink-dim); }
.addItem { margin: 8px 0 0; border: 1px dashed var(--v04-line); border-radius: 999px; background: transparent; color: var(--v04-accent); padding: 5px 12px; font-size: 11px; font-weight: 800; }
.addItem:hover { border-color: rgb(var(--v04-accent-rgb) / .45); }
.itemEditor { display: grid; gap: 8px; padding: 8px; border: 1px solid rgb(var(--v04-accent-rgb) / .45); border-radius: 10px; background: var(--v04-sunken); }
.itemEditor .eArea { min-height: 70px; border: 0; padding: 2px; background: transparent; }
.itemEditor .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--v04-muted); font-size: 11px; }
.itemEditor .row .grow { flex: 1; }
.itemEditor label { display: grid; gap: 4px; color: var(--v04-subject); font-size: 10px; font-weight: 800; }
.itemEditor select { appearance: none; height: 30px; border: 1px solid var(--v04-line); border-radius: 999px; background: var(--v04-panel) var(--v04-chevron) no-repeat right 10px center / 10px 6px; color: var(--v04-ink); padding: 0 28px 0 12px; font-size: 12px; }
.editorGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.editorError { margin: 0; color: var(--v04-danger); font-size: 11px; }

/* 出处标记（6.7）与浮层 */
.srcMark, .roundMark { display: inline-flex; align-items: center; margin: 0 0 0 5px; border: 1px solid rgb(var(--v04-accent-rgb) / .38); border-radius: 999px; background: transparent; padding: 0 7px; color: var(--v04-accent); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; line-height: 1.8; white-space: nowrap; vertical-align: 1px; }
.srcMark:hover, .srcMark[aria-expanded="true"] { background: rgb(var(--v04-accent-rgb) / .12); }
.roundMark { border-color: rgb(var(--v04-subject-rgb) / .5); color: var(--v04-subject); font-family: inherit; }
.roundMark:hover { background: rgb(var(--v04-subject-rgb) / .1); }
.srcPop { position: fixed; z-index: 85; width: 340px; max-width: calc(100vw - 24px); padding: 12px 14px; border: 1px solid var(--v04-line); border-radius: 14px; background: var(--v04-panel); color: var(--v04-ink); font-size: 12px; box-shadow: 0 20px 70px rgb(var(--v04-shadow-rgb) / calc(.5 * var(--v04-shadow-strength))); }
.srcPop h4 { margin: 0 0 8px; color: var(--v04-subject); font-size: 10px; font-weight: 900; letter-spacing: .1em; }
.srcPop .quote { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--v04-line); line-height: 1.65; }
.srcPop .quote span { color: var(--v04-muted); font-size: 11px; }
.srcPop .quote span b { display: block; color: var(--v04-subject); font-weight: 800; }
.srcPop .quote p { margin: 0; color: var(--v04-ink-soft); overflow-wrap: anywhere; }
.srcPop .quote.ctx p { color: var(--v04-muted); }
.srcPop footer { display: flex; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--v04-line); }

.methodIntro { margin: 0 0 16px; padding: 12px 16px; border-left: 3px solid var(--v04-subject); border-radius: 0 10px 10px 0; background: rgb(var(--v04-subject-rgb) / .07); color: var(--v04-ink-soft); font-size: 13px; line-height: 1.75; }
.methodIntro b { color: var(--v04-ink); }
.filterRows { display: grid; gap: 8px; margin: 0 0 18px; }
.filterRow { display: flex; align-items: center; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.filterRow::-webkit-scrollbar { display: none; }
.filterRow > span { flex: none; width: 34px; color: var(--v04-muted); font-size: 10px; font-weight: 800; }
.filterRow .pillToggle { padding: 6px 12px; }

function parseTags(text) {
  const seen = new Set(); const tags = [];
  for (const raw of String(text).split(/[，,]/)) {
    const tag = raw.normalize("NFKC").trim().replace(/\s+/g, " ");
    if (!tag) continue;
    const key = tag.toLocaleLowerCase("zh-CN").replace(/\s/g, "");
    if (seen.has(key)) continue;
    seen.add(key); tags.push(tag);
  }
  return tags;
}

const showingToasts = new Set();
function notify(message, tone) {
  if (showingToasts.has(message)) return;

  setTimeout(() => { showingToasts.delete(message); el.remove(); }, tone === "warn" ? 4200 : 3000);
}

function startTimer() {

    const r = recOf(player.key, player.part);
    if (!r || !player.playing) { clearInterval(player.timer); return; }
    player.t = Math.min(r.dur, player.t + 1);
    if (player.t >= r.dur) { player.playing = false; clearInterval(player.timer); }
    refreshPlayer();
  }, 1000);
}

  Object.assign(player, { key, part, t: Math.max(0, Math.min(r.dur, t)), playing: true, hl: true });
  state.recPart[key] = part;
  if (!player.told) { player.told = true; notify("demo 没有真实录音，只演示播放进度与当前句高亮"); }
  startTimer();
  const slot = $(`[data-rec-slot="${key}"]`);
  if (slot) slot.innerHTML = recordingBodyHTML(key, slotOpts(key)); else refreshPlayer();
}

}

function srcLabel(s) { return s[0] === "S" ? `总结 · ${clock(s[1])}` : s[0] === "C" ? `客户录音 · ${clock(s[1])}` : `案例 ${s[0]} · ${clock(s[1])}`; }
function marksHTML(item, monthKey) {
  const src = (item.src || []).map((s) => `<button type="button" class="srcMark" aria-haspopup="dialog" aria-expanded="false" title="${s[0] === "C" ? `案例 ${s[2]} 的需求凭证 · ` : s[2] > 1 ? `第 ${s[2]} 段 · ` : ""}点开看原话" data-action="src" data-month="${monthKey}" data-c="${s[0]}" data-t="${s[1]}" data-p="${s[2] || 1}"${s[0] === "C" ? ` data-asset="${s[3]}"` : ""}>${srcLabel(s)}</button>`).join("");
  const rounds = (item.rounds || []).map((rid) => { const found = findRound(rid); return found ? `<button type="button" class="roundMark" title="跳到案例 ${caseNo(found.c)} 的这一回合" data-action="round-jump" data-round="${rid}">${esc(found.r.title)}</button>` : ""; }).join("");
  return src + rounds;
}
function resolveSrc(monthKey, c, t, p, assetId) {
  if (c === "C") {
    const found = findAssetById(assetId);
    const cs = caseByNo(monthKey, Number(p));
    return { client: true, asset: found && found.a, c: cs, line: found && found.a.lines.find((l) => l[0] === t), key: cs && cs.id };
  }
  const isSummary = c === "S";
  const key = isSummary ? `summary:${monthKey}` : (caseByNo(monthKey, Number(c)) || {}).id;
  if (!key) return null;
  const r = (RECS[key] || []).find((x) => x.part === p);       // 含已移除的：出处来自发布时的快照
  const line = r && r.lines.find((l) => l[0] === t);
  const c2 = isSummary ? null : caseByNo(monthKey, Number(c));
  return { key, r, line, c: c2, isSummary };
}
function openPop(button) {
  closePop();

  const info = resolveSrc(month, c, Number(t), Number(p), asset);
  const pop = document.createElement("div");
  pop.className = "srcPop";

  const head = info && info.client ? `案例 ${p} · ${info.c ? info.c.client : ""} · 客户录音「${info.asset ? info.asset.name : ""}」` : info && info.isSummary ? "整场总结" : info && info.c ? `案例 ${c} · ${info.c.client} · ${info.c.title}` : "出处";
  const who = info && info.client && info.line ? clientSpeaker(info.asset, info.line[1]) : info && info.line ? SPEAKER_NAMES[info.line[1]] : "";
  pop.innerHTML = `<h4>${esc(head)}${info && info.r && activeRecs(info.key).length > 1 ? ` · 第 ${p} 段` : ""}</h4>
    ${info && info.line ? `<div class="quote"><span><b>${esc(who)}</b>${clock(info.line[0])}</span><p>${esc(info.line[2])}</p></div>` : `<div class="quote"><span>—</span><p>这个片段不存在。</p></div>`}
    ${info && ((info.r && info.r.status === "REMOVED") || (info.asset && info.asset.state === "REMOVED")) ? `<p class="recNote" style="padding:6px 0">这段录音已被移除，原文来自发布时的快照。</p>` : ""}
    <footer><button type="button" class="reviewPrimaryButton" data-action="listen" data-month="${month}" data-c="${c}" data-t="${t}" data-p="${p}"${asset ? ` data-asset="${asset}"` : ""}>去听原声 →</button></footer>`;
  $("#popLayer").appendChild(pop);
  const rect = button.getBoundingClientRect();
  const w = pop.offsetWidth; const h = pop.offsetHeight;
  let left = Math.min(Math.max(12, rect.left), window.innerWidth - w - 12);
  let top = rect.bottom + 6;
  if (top + h > window.innerHeight - 12) top = Math.max(12, rect.top - h - 6);
  pop.style.left = `${left}px`; pop.style.top = `${top}px`;
  button.setAttribute("aria-expanded", "true");

}
function closePop() {

}
function listen(data) {

function draftOf() { const m = monthOf(route.month); return m.job && m.job.phase === "REVIEW" ? m.job.draft : null; }

    <section class="uploadDialog" role="dialog" aria-modal="true" aria-labelledby="ncTitle">
      <div class="uploadHead"><div><small>${edit ? "EDIT" : "NEW CASE"}</small><b id="ncTitle">${edit ? "编辑基本信息" : "新建案例"}</b></div><button type="button" class="uploadClose" data-action="close-overlay" aria-label="关闭">×</button></div>
      <div class="uploadBody">
        ${edit ? "" : `<p class="hint">先填基本信息并创建；任务与最初需求、过程（每一回合：我们交了什么 → 客户怎么反馈 → 我们怎么应对）在案例页里点一下就能填，离开输入框自动保存。</p>`}
        <div class="two">
          <label class="field"><small>复盘月份 *</small><select id="nc-month" data-nc="month">${months.map(([label, key]) => `<option value="${key}"${d.month === key ? " selected" : ""}>${edit ? label : `${label} · ${monthTitle(key)}`}</option>`).join("")}</select></label>
          <label class="field"><small>部门 *</small><input data-nc="dept" list="ncDepts" maxlength="${LIMITS.dept}" value="${esc(d.dept)}" placeholder="如：创意一部"><datalist id="ncDepts">${departments().map((x) => `<option value="${esc(x)}"></option>`).join("")}</datalist></label>
        </div>
        <label class="field"><small>客户 *</small><input data-nc="client" maxlength="${LIMITS.client}" value="${esc(d.client)}" placeholder="如：某乳企"></label>
        <label class="field"><small>案例标题 *</small><input data-nc="title" maxlength="${LIMITS.title}" value="${esc(d.title)}" placeholder="一句话说清这件事，如：年货节主视觉三次被否"></label>
        <label class="field"><small>客户服务场景 <i>选填，逗号分隔，最多 ${LIMITS.tags} 个</i></small><input data-nc="scenes" value="${esc(d.scenes)}" placeholder="提案、改稿、客户情绪、需求变更、比稿、结案"></label>
        ${o.error ? `<p class="formError" role="alert">${esc(o.error)}</p>` : ""}
      </div>
      <div class="uploadFooter"><button type="button" data-action="close-overlay">取消</button><button type="button" class="uploadGo" data-action="nc-submit">${edit ? "保存" : "创建并填写过程 →"}</button></div>
    </section></div>`;
}
function validateNewCase(d, months) {
  if (!(months || MONTH_CHOICES).some(([, key]) => key === d.month)) return "请选择复盘月份。";
  if (!d.dept.trim()) return "请填写部门。";
  if (d.dept.trim().length > LIMITS.dept) return `部门不超过 ${LIMITS.dept} 字。`;
  if (!d.client.trim()) return "请填写客户。";
  if (!d.title.trim()) return "请填写案例标题：一句话说清这件事。";
  const tags = parseTags(d.scenes);
  if (tags.length > LIMITS.tags) return `客户服务场景最多 ${LIMITS.tags} 个。`;
  if (tags.some((t) => t.length > LIMITS.tagLength)) return `每个场景标签不超过 ${LIMITS.tagLength} 字。`;
  return "";
}
function submitNewCase() {
  const o = state.overlay;
  const d = o.draft;
  const edit = o.mode === "edit";
  const error = validateNewCase(d, edit ? EDIT_MONTHS : MONTH_CHOICES);
  if (error) { o.error = error; renderNewCase(); $(".formError")?.scrollIntoView({ block: "nearest" }); return; }
  if (edit) {
    const c = findCase(o.caseId);
    Object.assign(c, { month: d.month, dept: d.dept.trim(), client: d.client.trim(), title: d.title.trim(), scenes: parseTags(d.scenes) });
    closeOverlay();
    renderPreserving();
    notify("已保存");
    return;
  }
  const c = {
    id: nextId("rtc"), month: d.month, dept: d.dept.trim(), client: d.client.trim(), title: d.title.trim(), scenes: parseTags(d.scenes), background: "",
    rounds: [round(nextId("rnd"), "第 1 版", "", "", "", "")], outcome: "", turning: "", questions: "",
    by: state.viewer, byName: viewer().name, at: new Date().toISOString(),
  };
  c.brief = { id: `brief-${c.id}`, assets: [] };
  CASES.push(c);
  RECS[c.id] = [];
  closeOverlay();
  state.savedAt = "";
  goCase(c.id);
  notify("案例已创建，接着把过程一回合一回合填上");
  activateField("case.background");          // 新建后光标直接落在「任务与最初需求」
}

/* ============================================================
   浮层：确认框（DeleteConfirmDialog 同一套壳）、大图查看
   ============================================================ */
function lockScroll(on) { document.body.style.overflow = on ? "hidden" : ""; }
function closeOverlay() {
  const previous = state.overlay;
  state.overlay = null;
  $("#overlay").innerHTML = "";
  lockScroll(false);
  if (previous && previous.returnFocus && previous.returnFocus.isConnected) previous.returnFocus.focus?.({ preventScroll: true });
}
function openConfirm(opts) {
  state.overlay = { kind: "confirm", ...opts, returnFocus: document.activeElement };
  lockScroll(true);
  $("#overlay").innerHTML = `<div class="uploadBackdrop" role="presentation" data-backdrop="confirm">
    <section class="uploadDialog deleteDialog" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
      <div class="uploadHead"><div><small>${esc(opts.eyebrow)}</small><b id="cfTitle">${esc(opts.title)}</b></div><button type="button" class="uploadClose" data-action="close-overlay" aria-label="关闭">×</button></div>
      <div class="uploadBody"><b>${esc(opts.lead)}</b>${opts.lines.map((line) => `<span class="deleteDialogLine">${esc(line)}</span>`).join("")}</div>
      <div class="uploadFooter"><button type="button" id="cfCancel" data-action="close-overlay">取消</button><button type="button" class="deleteDialogConfirm" data-action="confirm-ok">${esc(opts.confirmLabel)}</button></div>
    </section></div>`;
  $("#cfCancel").focus();                 // 不可逆操作，默认焦点落在「取消」
}
function confirmOk() {
  const o = state.overlay;
  state.overlay = null; $("#overlay").innerHTML = ""; lockScroll(false);
  o.onConfirm();
}
function openDeleteCase(id) {
  const c = findCase(id);
  openConfirm({
    eyebrow: "DELETE", title: "删除案例", lead: `把《${c.title}》移入回收站？`,
    lines: ["案例会从客户需求复盘库中移除，可由上传者或系统管理员恢复；附件和录音文件不会被清理。", "已发布纪要里引用这个案例的出处仍然保留。"],
    confirmLabel: "确认移入回收站",
    onConfirm: () => { c.deleted = true; notify(`《${c.title}》已移入回收站`); goHome(); },
  });
}
function openViewer(holderId, assetId) {
  const holder = findHolder(holderId);
  const found = { c: holder.c, r: { title: holder.h.title || "任务与最初需求" } };
  const a = holder.h.assets.find((x) => x.id === assetId);
  if (a.state !== "READY") return;
  if (a.type === "VIDEO") { notify("站内播放走 stream 路由（302 到新签地址）；demo 没有真实视频"); return; }
  if (a.type === "AUDIO") { if (assetAudio.id === a.id) closeAssetAudio(); else openAssetAudio(a.id, 0); return; }
  if (a.type === "DOC") { notify(a.fmt === "PDF" ? `线上点开时签发 GET 链接，在新标签页打开「${a.name}」` : `Word／Excel／PPT 浏览器打不开，点开就是下载「${a.name}」（demo 不下载）`); return; }
  state.overlay = { kind: "viewer", returnFocus: document.activeElement };
  lockScroll(true);
  $("#overlay").innerHTML = `<div class="ov" data-backdrop="viewer"><div class="ovbox" role="dialog" aria-modal="true" aria-label="查看图片">
    <div class="ovhead"><b>${esc(found.r.title)}</b><span class="ovheadT">${esc(a.name)} · ${esc(found.c.title)}</span><button type="button" class="smBtn" id="viewerClose" data-action="close-overlay">关闭 esc</button></div>
    <div class="viewerBody" data-v04-scheme="dark"><div class="viewerImage" role="img" aria-label="${esc(a.name)}" style="background:${artOf(a.art)}"></div></div></div></div>`;
  $("#viewerClose").focus();
}

/* ============================================================
   渲染入口与事件
   ============================================================ */
function render() {
  if (!$("#siteHeader")) $("#app").innerHTML = `<main class="surface"><header class="siteHeader" id="siteHeader"></header><div id="demoStrip"></div><div id="page"></div></main>`;
  renderHeader();
  renderDemoStrip();
  if (route.page === "case") renderCase();
  else if (route.page === "month") renderMonth();
  else renderHome();
}

document.addEventListener("click", (event) => {
  if (state.themeOpen && !event.target.closest("[data-theme-switcher]")) { state.themeOpen = false; renderHeader(); }
  if (event.target.closest("[data-theme-pick]")) { chooseTheme(event.target.closest("[data-theme-pick]").dataset.themePick); return; }
  if (state.pop && !event.target.closest(".srcPop") && !event.target.closest(".srcMark")) closePop();
  const editableEl = event.target.closest("[data-editable]");
  if (editableEl) { activateField(editableEl.dataset.editable); return; }
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const d = target.dataset;
  switch (d.action) {
    case "theme-toggle": state.themeOpen = !state.themeOpen; renderHeader(); if (state.themeOpen) $(".option[aria-checked='true']")?.focus(); break;
    case "go-home": event.preventDefault(); goHome(); break;
    case "other-library": notify("demo 只演示复盘库"); break;
    case "demo-month": setDemoMonth(d.state); break;
    case "clear-filters": state.dept = "ALL"; state.query = ""; state.committedQuery = ""; renderPreserving(); break;
    case "new-case": openNewCase(); break;
    case "nc-submit": submitNewCase(); break;
    case "open-case": event.preventDefault(); goCase(d.id); break;
    case "go-month": event.preventDefault(); goMonth(d.month, d.tab ? { tab: d.tab } : {}); break;
    case "month-tab": state.monthTab = d.tab; state.draftEditing = null; try { history.replaceState(null, "", hashOf({ ...route, tab: d.tab })); } catch (error) { /* 忽略 */ } renderPreserving(); break;
    case "edit-basic": openEditBasic(d.id); break;
    case "edit-done": document.activeElement?.blur?.(); state.editing = false; state.pickerRound = null; renderPreserving(); notify(state.savedAt ? `已保存 ${state.savedAt}` : "没有改动"); break;
    case "delete-case": openDeleteCase(d.id); break;
    case "round-move": moveRound(d.id, Number(d.step)); break;
    case "round-delete": deleteRound(d.id); break;
    case "round-add": addRound(); break;
    case "asset-picker": state.pickerRound = state.pickerRound === d.id ? null : d.id; renderPreserving(); break;
    case "asset-pick": pickAssets(d.id, d.kind); break;
    case "asset-remove": removeAsset(d.round, d.id); break;
    case "asset-retry": { const { h } = findHolder(d.round); const a = h.assets.find((x) => x.id === d.id); a.state = "UPLOADING"; a.pct = 0; refreshHolderAssets(h); uploadAsset(h, a, 0); break; }
    case "asset-audio-toggle": { const found = findAssetById(d.id); assetAudio.playing = !assetAudio.playing; if (assetAudio.playing) { if (assetAudio.t >= found.a.dur) assetAudio.t = 0; openAssetAudio(d.id, assetAudio.t); } else { stopAssetAudio(); refreshAssetAudio(); } break; }
    case "asset-audio-seek": { const found = findAssetById(d.id); const rect = target.getBoundingClientRect(); openAssetAudio(d.id, Math.round(((event.clientX - rect.left) / rect.width) * found.a.dur)); break; }
    case "asset-audio-close": closeAssetAudio(); break;
    case "asset-audio-at": openAssetAudio(d.id, Number(d.t)); break;
    case "asset-transcribe-retry": { const found = findAssetById(d.id); transcribeAsset(found.h, found.a); refreshHolderAssets(found.h); notify("已重新提交转写"); break; }

    case "asset-open": openViewer(d.round, d.id); break;
    case "link-open": openLinkPicker(d.id); break;
    case "link-tab": state.overlay.tab = d.kind; renderLinkPicker(); break;
    case "link-toggle": toggleLink(d.key); break;
    case "link-save": saveLinks(); break;
    case "link-remove": { const c = findCase(route.id); const r = c.rounds.find((x) => x.id === d.round); r.links.splice(Number(d.index), 1); touchSaved(); renderPreserving(); break; }
    case "link-go": { const w = findWork(d.kind, d.id); notify(!w || w.deleted ? "原作品已删除，关联本身保留" : `线上点开就到${LIB_LABEL[d.kind]}的原作品页（demo 不跳转）`); break; }
    case "rec-upload": openRecUpload(d.key); break;
    case "noop": notify("demo 里用下面的按钮代替系统的选文件窗口"); break;
    case "rec-pick": pickRecording(d.kind); break;
    case "rec-part": state.recPart[d.key] = Number(d.part); if (player.key === d.key && player.part !== Number(d.part)) stopPlayer(true); $(`[data-rec-slot="${d.key}"]`).innerHTML = recordingBodyHTML(d.key, slotOpts(d.key)); break;
    case "rec-retry": retryRecording(d.key, Number(d.part)); break;
    case "rec-remove": removeRecording(d.key, Number(d.part)); break;
    case "play-toggle": togglePlay(d.key, Number(d.part)); break;
    case "seek": playFrom(d.key, Number(d.part), Number(d.t)); break;
    case "seek-bar": { const r = recOf(d.key, Number(d.part)); const rect = target.getBoundingClientRect(); const t = Math.round(((event.clientX - rect.left) / rect.width) * r.dur); playFrom(d.key, Number(d.part), t); break; }
    case "job-generate": requestGenerate(route.month, false); break;
    case "job-fail-next": { const m = monthOf(route.month); if (m.job) { m.job.failNext = true; notify("下一次推进会失败（demo）"); } break; }
    case "job-retry": retryJob(route.month); break;
    case "job-abandon": abandonJob(route.month, "job"); break;
    case "job-revise": reviseFromPublished(route.month); break;
    case "draft-abandon": abandonJob(route.month, "draft"); break;
    case "draft-regenerate": requestGenerate(route.month, true); break;
    case "draft-publish": publishDraft(route.month); break;
    case "draft-edit": startDraftEdit(d.key); break;
    case "draft-del": deleteDraftItem(d.key); break;
    case "draft-add": addDraftItem(d.section); break;
    case "cand-done": candDone(d.key); break;
    case "method-filter": if (d.group === "dim") state.dimFilter = d.value; else state.kindFilter = d.value; renderPreserving(); break;
    case "src": if (state.pop && state.pop.button === target) closePop(); else openPop(target); break;
    case "listen": listen(d); break;
    case "round-jump": { closePop(); const found = findRound(d.round); if (found) goCase(found.c.id, { round: d.round }); break; }
    case "close-overlay": closeOverlay(); break;
    case "confirm-ok": confirmOk(); break;
    default: break;
  }
});

/* 遮罩：确认框、查看器点遮罩就关；新建对话框只在表单还空着时才关（10.4）。 */
document.addEventListener("mousedown", (event) => {
  const backdrop = event.target.dataset && event.target.dataset.backdrop;
  if (!backdrop || !state.overlay) return;
  if (backdrop === "new") { if (dialogClosable(state.overlay)) closeOverlay(); return; }
  closeOverlay();
});
document.addEventListener("input", (event) => {
  const t = event.target;
  if (t.dataset.nc && state.overlay && state.overlay.kind === "new") { state.overlay.draft[t.dataset.nc] = t.value; state.overlay.dirty = true; return; }
  if (t.dataset.inplace && t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = `${t.scrollHeight + 2}px`; }
  if (t.dataset.edit === "case.background") { const hint = $("[data-brief-hint]"); if (hint) hint.hidden = !!t.value.trim(); }
  if (t.dataset.edit && t.dataset.edit !== "case.scenes" && t.dataset.edit !== "case.month") {
    const { obj, key } = editTarget(t.dataset.edit);
    if (obj && !(REQUIRED[t.dataset.edit] || key === "title")) obj[key] = t.value;   // 必填项在失焦时校验后再写
  }
  if (t.dataset.draftEdit) { const { item } = draftLocate(t.dataset.draftEdit); if (item) item.text = t.value; }
  if (t.dataset.cand) {
    const { item } = draftLocate(t.dataset.key);
    if (!item) return;
    item[t.dataset.cand] = t.value;
    if (item.origin === "AI") item.edited = true;
    draftSaved();
  }
});
document.addEventListener("change", (event) => {
  const t = event.target;
  if (t.matches("[data-viewer-switch]")) { state.viewer = t.value; state.draftEditing = null; closePop(); renderPreserving(); notify(`已切换为「${viewer().label}」`); return; }
  if (t.matches("[data-dept-filter]")) { state.dept = t.value; renderPreserving(); return; }
  if (t.dataset.nc && state.overlay && state.overlay.kind === "new") { state.overlay.draft[t.dataset.nc] = t.value; state.overlay.dirty = true; return; }
  if (t.matches("[data-history]")) { const m = monthOf(route.month); const v = Number(t.value); m.viewing = v === m.pubs.length ? null : v; renderPreserving(); return; }
  if (t.dataset.edit === "case.month") { commitEdit(t); return; }
  if (t.dataset.cand && t.tagName === "SELECT") {
    const { item } = draftLocate(t.dataset.key);
    if (!item) return;
    item[t.dataset.cand] = t.value; if (item.origin === "AI") item.edited = true; draftSaved();
    if (t.dataset.cand === "kind") renderPreserving();     // 情境类要多出「情境」一栏
  }
});
document.addEventListener("focusin", (event) => {
  const t = event.target;
  if (t.dataset && t.dataset.edit) { const { obj, key } = editTarget(t.dataset.edit); editPrev = obj ? (key === "scenes" ? obj.scenes.join("，") : obj[key]) : ""; }
  if (t.dataset && t.dataset.draftEdit) { const { item } = draftLocate(t.dataset.draftEdit); draftPrev = item ? item.text : ""; }
});
document.addEventListener("focusout", (event) => {
  const t = event.target;
  if (!t.dataset || !t.isConnected) return;
  if (t.dataset.edit && t.dataset.edit !== "case.month") commitEdit(t);
  if (t.dataset.draftEdit) commitDraftEdit(t);
  if (t.dataset.inplace) finishField(t, false);
});
document.addEventListener("keydown", (event) => {
  const overlay = state.overlay;
  if (state.themeOpen) {
    const options = $$(".option");
    const index = options.indexOf(document.activeElement);
    if (event.key === "Escape") { state.themeOpen = false; renderHeader(); $("[data-theme-switcher] .trigger")?.focus(); return; }
    const next = { ArrowDown: (index + 1) % options.length, ArrowUp: (index - 1 + options.length) % options.length }[event.key];
    if (next !== undefined && index >= 0) { event.preventDefault(); options[next].focus(); }
    return;
  }
  if (event.target.dataset && event.target.dataset.editable && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); activateField(event.target.dataset.editable); return; }
  if (event.target.dataset && event.target.dataset.inplace) {
    if (event.key === "Escape") { event.preventDefault(); const path = event.target.dataset.inplace; finishField(event.target, true); $(`[data-editable="${path}"]`)?.focus(); return; }
    if (event.key === "Enter" && event.target.tagName === "INPUT") { event.preventDefault(); const path = event.target.dataset.inplace; finishField(event.target, false); $(`[data-editable="${path}"]`)?.focus(); return; }
    return;
  }
  if (event.key === "Escape" && state.pop) { const b = state.pop.button; closePop(); b.focus(); return; }
  if (overlay) {
    if (event.key === "Escape") { if (overlay.kind === "new" && !dialogClosable(overlay)) return; closeOverlay(); }
    return;
  }
  if (event.key === "Escape" && state.draftEditing && state.draftEditing.startsWith("candidates|")) { candDone(state.draftEditing); return; }
  if (event.target.classList && event.target.classList.contains("reviewAudioTrack") && (event.key === "ArrowRight" || event.key === "ArrowLeft")) {
    event.preventDefault();
    const key = event.target.dataset.key; const part = Number(event.target.dataset.part);
    const base = player.key === key && player.part === part ? player.t : 0;
    playFrom(key, part, base + (event.key === "ArrowRight" ? 10 : -10));
  }
});
window.addEventListener("scroll", () => { if (state.pop) closePop(); }, { passive: true });
window.addEventListener("resize", () => { if (state.pop) closePop(); });
window.addEventListener("popstate", () => { const next = parseHash(); navigate(next, false); });

/* 首次进入：按地址栏路由（直接打开 #/retro/<id>?t=760 也能定位到录音） */
(function boot() {
  const next = parseHash();
  Object.assign(route, next);
  if (route.page === "month") state.monthTab = route.tab || "CASES";
  render();
  afterNavigate();
})();
</script>
</body>
</html>
